  function spawnEnemy(event) {
    const def = ENEMY_DEF[event.kind];
    if (!def) return;
    const rules = modeRules();
    const yScale = clamp(state.viewH / 720, .76, 1.18);
    const hpScale = (event.scale || 1) * rules.enemyHp * (1 + (state.act - 1) * .045);
    const topY = state.layout.track.top + 30;
    const nearY = state.layout.playerY - 178;
    const spawnY = Number.isFinite(event.spawnY) ? event.spawnY : lerp(topY, nearY, clamp(event.depth || 0, 0, .72));
    const holdY = Number.isFinite(event.holdDepth) ? lerp(state.layout.track.top + 86, state.layout.playerY - 218, clamp(event.holdDepth, 0, 1)) : null;
    const enemy = {
      id: `${state.generation}:e:${state.simTime}:${state.enemies.length}`,
      kind: event.kind, nx: event.nx, baseNx: event.nx, x: nxToX(event.nx),
      y: spawnY, hp: def.hp * hpScale, maxHp: def.hp * hpScale,
      speed: def.speed * yScale * rules.enemySpeed * (1 + (state.act - 1) * .022),
      radius: def.radius, damage: Math.max(1, Math.ceil(def.damage * rules.enemyDamage)),
      score: def.score * (event.scale || 1) * (state.difficulty === 'hard' ? 1.22 : 1),
      phase: event.phase ?? state.spawnRng.range(0, TAU),
      shieldSide: event.shieldSide || state.spawnRng.sign(),
      shieldHp: event.kind === 'shield' ? 21 * hpScale : 0,
      attackTimer: event.kind === 'thrower' ? state.spawnRng.range(.88, 1.28) : event.kind === 'drummer' ? 1.05 : 0,
      flash: 0, dead: false, nearChecked: false, spawnedAt: state.simTime,
      entryTimer: .28, holdY, pulses: event.pulses ?? (event.kind === 'drummer' ? 2 : 0),
      chargeState: event.kind === 'charger' ? 'aim' : null,
      chargeTimer: event.kind === 'charger' ? (event.aim ?? (state.difficulty === 'hard' ? .70 : .95)) : 0,
      chargeMarked: false, lockedNx: Number.isFinite(event.targetNx) ? event.targetNx : null,
      dashSpeed: (state.difficulty === 'hard' ? 338 : 300) * yScale,
      beat: event.beat ?? 0,
    };
    state.enemies.push(enemy);
  }

  function spawnMite(nx, y, direction = 1) {
    const def = ENEMY_DEF.mite;
    const rules = modeRules();
    const miteNx = clamp(nx + direction * .035, .04, .96);
    state.enemies.push({
      id: `${state.generation}:m:${state.simTime}:${state.enemies.length}`,
      kind: 'mite', nx: miteNx, baseNx: miteNx,
      x: nxToX(miteNx), y, hp: def.hp * rules.enemyHp * (1 + state.act * .06), maxHp: def.hp * rules.enemyHp,
      speed: def.speed * rules.enemySpeed * clamp(state.viewH / 720, .76, 1.18), radius: def.radius,
      damage: Math.ceil(def.damage * rules.enemyDamage), score: def.score * (state.difficulty === 'hard' ? 1.22 : 1), phase: state.spawnRng.range(0, TAU),
      shieldSide: 0, shieldHp: 0, attackTimer: 0, flash: 0, dead: false, nearChecked: false,
      entryTimer: .12, holdY: null, pulses: 0, chargeState: null,
    });
  }

  function spawnReinforcement(source) {
    if (!source || source.dead || source.pulses <= 0) return;
    source.pulses--;
    const count = state.difficulty === 'hard' ? 4 : 3;
    for (let i = 0; i < count; i++) {
      const nx = clamp(source.nx + (i - (count - 1) / 2) * .055, .06, .94);
      spawnEnemy({ kind: i === count - 1 && state.difficulty === 'hard' ? 'fast' : 'chaff', nx, scale: .78 + state.act * .05, spawnY: source.y + 26, phase: i });
    }
    addText(source.nx, source.y + 34, '鼓', COLORS.ochre, .55, 20, 'world');
    addParticle(source.nx, source.y, COLORS.ochre, 10, .65);
    sfx('drum', .45, .88);
  }

  function playerFootprint() {
    if (!state.player) return 22;
    const p = state.player;
    const formScale = { fan: 1.18, spear: .66, spiral: .88, drum: .96 }[p.form] || 1;
    const crowd = clamp(18 + Math.sqrt(p.count) * 6.1, 28, 94);
    return Math.min(crowd * formScale, state.layout.track.width * .23);
  }

  function fireCadence() {
    const p = state.player;
    const form = FORM[p.form];
    const echo = p.echoTimer > 0 ? .74 : 1;
    const stamp = p.stampTimer > 0 ? .72 : 1;
    return Math.max(.075, form.cadence / p.tempo * echo * stamp);
  }

  function volleyShotCount() {
    const p = state.player;
    const form = FORM[p.form];
    return clamp(Math.floor(form.minShots + p.count * form.countScale), form.minShots, form.maxShots + p.mastery[p.form] * 2);
  }

  function spawnVolley() {
    const p = state.player;
    if (!p) return;
    const form = FORM[p.form];
    const count = volleyShotCount();
    const mastery = p.mastery[p.form];
    const gatePhase = state.phase === 'gate';
    const focused = gatePhase ? state.gates.find(g => g.id === state.focusGateId) : null;
    const totalDamage = (3.2 + p.count * .42) * p.power * form.damage * (1 + mastery * .08) * (p.stampTimer > 0 ? 1.28 : 1);
    const perShot = totalDamage / Math.max(1, count);
    const maxBullets = state.quality.level === 'low' ? 180 : 270;

    for (let i = 0; i < count && state.bullets.length < maxBullets; i++) {
      const t = count === 1 ? .5 : i / (count - 1);
      let spread = (t - .5) * form.spread;
      let nx = p.nx + spread * .15;
      let vx = spread * .13;
      let radius = p.form === 'drum' ? 6.2 : p.form === 'spear' ? 3.3 : 4.1;
      if (p.form === 'spiral') {
        const a = state.simTime * 5 + t * TAU;
        nx += Math.sin(a) * .03;
        vx += Math.cos(a) * .035;
      }
      if (p.form === 'drum') vx += Math.sin(state.simTime * 31 + i * 2.399963 + state.seed * .00001) * .012;
      if (gatePhase && focused) {
        const targetNx = focused.nx + (t - .5) * .08;
        vx = (targetNx - nx) * 1.8;
      }
      state.bullets.push({
        nx: clamp(nx, -.08, 1.08), x: nxToX(nx), y: p.y - 44,
        vx, vy: -form.speed, radius, damage: perShot,
        pierce: form.pierce + Math.floor(mastery / 2), form: p.form,
        gateId: gatePhase && focused ? focused.id : null,
        // Gate growth is a time commitment, not a reward for an already
        // snowballing damage build. Tempo changes volley frequency, while
        // per-volley charge compensates to keep full-focus time readable.
        gateCharge: gatePhase ? (36.5 * form.gate * (1 + mastery * .035) * fireCadence()) / count : 0,
        dead: false, age: 0, stamp: p.stampTimer > 0,
      });
    }
    sfx(p.form === 'drum' ? 'drum' : 'shot', .13 + Math.min(.2, count / 100), 1 + p.power * .015);
  }

  function spawnEnemyShot(enemy, kind = 'paperBomb') {
    const targetNx = clamp(state.player.nx + state.spawnRng.range(-.06, .06), .07, .93);
    const startY = enemy.y + (enemy.radius || 12);
    const vy = (kind === 'bossFire' ? 196 : 176) * clamp(state.viewH / 720, .84, 1.16);
    const travel = clamp((state.layout.playerY - startY) / Math.max(1, vy), .72, 3.2);
    state.enemyShots.push({
      kind, nx: enemy.nx, x: nxToX(enemy.nx), y: startY,
      targetNx, vx: (targetNx - enemy.nx) / travel, vy,
      radius: kind === 'bossFire' ? 15 : 11, damage: Math.ceil((kind === 'bossFire' ? 5 : 3) * modeRules().enemyDamage),
      dead: false, nearChecked: false, age: 0,
    });
    state.hazards.push({ kind: 'target', nx: targetNx, x: nxToX(targetNx), y: state.layout.playerY, radius: 34, life: travel, maxLife: travel, dead: false });
  }

  function spiralIntercept(shot) {
    const p = state.player;
    if (!p || p.form !== 'spiral') return false;
    const mastery = p.mastery.spiral;
    const orbit = 44 + mastery * 7;
    const dx = shot.x - p.x;
    const dy = shot.y - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (Math.abs(d - orbit) < shot.radius + 13 + mastery * 2) {
      shot.dead = true;
      addMomentum(3.5, 'destroy');
      addScore(35, shot.nx, shot.y, '截');
      addParticle(shot.nx, shot.y, COLORS.green, 9, .8);
      sfx('shield', .45, 1.3);
      return true;
    }
    return false;
  }

  function activateStamp(manual = true) {
    const p = state.player;
    if (!p || p.momentum < 100 || !['playing', 'boss', 'transition'].includes(state.mode)) return false;
    p.momentum = 0;
    p.readyTime = 0;
    p.stampTimer = 2.25;
    if (p.charms.includes('echo')) p.echoTimer = 3.25;
    state.stats.stampUses++;
    if (manual) state.stats.manualStamps++; else state.stats.autoStamps++;
    state.shake = state.profile.settings.reducedMotion ? 3 : 15;
    state.flash = .55;
    state.hitStop = state.profile.settings.reducedMotion ? 0 : .06;
    sfx('stamp', 1);
    haptic([55, 25, 80]);

    for (const shot of state.enemyShots) {
      if (!shot.dead) {
        shot.dead = true;
        addScore(20, shot.nx, shot.y, '祓');
      }
    }
    for (const hazard of state.hazards) if (hazard.kind !== 'target') hazard.dead = true;
    for (const enemy of state.enemies) {
      if (enemy.dead) continue;
      if (enemy.isBoss) applyBossRawDamage(enemy, enemy.maxHp * (state.difficulty === 'hard' ? .055 : .07));
      else if (['chaff', 'fast', 'mite'].includes(enemy.kind)) enemy.hp = 0;
      else enemy.hp -= Math.max(28, enemy.maxHp * .42);
      enemy.flash = .22;
      enemy.y -= 28;
    }
    addParticle(p.nx, p.y - 45, COLORS.red, 56, 1.65, 'paper');
    addText(p.nx, p.y - 110, '祭', COLORS.red, 1.0, 56, 'world');
    updateControls();
    return true;
  }

  function hurtPlayer(amount, source, nx, y) {
    const p = state.player;
    if (!p || state.phase === 'bossDefeat' || state.mode === 'result' || p.invuln > 0) return;
    if (p.shield > 0) {
      p.shield--;
      p.invuln = .18;
      addText(p.nx, p.y - 72, '結', COLORS.green, .6, 27, 'world');
      addParticle(p.nx, p.y - 20, COLORS.green, 13, .8);
      sfx('shield', .8);
      haptic(18);
      return;
    }
    const before = p.count;
    p.count = Math.max(0, p.count - amount);
    const lost = before - p.count;
    state.stats.damageLost += lost;
    state.stats.deathCause = source;
    if (state.currentEncounter) state.currentEncounter.damaged = true;
    state.combo = 0;
    state.comboTimer = 0;
    p.invuln = .28;
    state.shake = state.profile.settings.reducedMotion ? 2 : 10;
    state.flash = .28;
    addText(p.nx, p.y - 72, `-${lost}`, COLORS.red, .8, 31, 'world');
    burstFollowers(p.nx, p.y - 10, Math.max(6, lost));
    sfx('hurt', .9);
    haptic([35, 25, 35]);

    if (p.count <= 0 && p.charms.includes('crane') && !p.craneUsed) {
      p.craneUsed = true;
      p.count = 1;
      p.shield = Math.min(p.maxShield, 3);
      p.invuln = 1.5;
      addText(p.nx, p.y - 110, '鶴', COLORS.white, 1.2, 44, 'world');
      addParticle(p.nx, p.y - 25, COLORS.white, 32, 1.2);
      return;
    }
    if (p.count <= 0) endRun(false, source);
  }

  function killEnemy(enemy, byStamp = false) {
    if (enemy.dead) return;
    enemy.dead = true;
    state.stats.kills++;
    state.combo++;
    state.comboTimer = 1.5;
    const style = ENEMY_STYLE[enemy.kind] || ENEMY_STYLE.chaff;
    addScore(enemy.score, enemy.nx, enemy.y);
    addMomentum(enemy.isBoss ? 28 : ['armor', 'shield', 'thrower', 'charger', 'drummer'].includes(enemy.kind) ? 5 : 2.1, 'destroy');
    addParticle(enemy.nx, enemy.y, style.ink, enemy.isBoss ? 70 : 12, enemy.isBoss ? 1.8 : .75, 'paper');
    const priority = ['armor', 'shield', 'thrower', 'charger', 'drummer'].includes(enemy.kind);
    if (priority) state.stats.priorityKills++;
    if (!enemy.isBoss && priority && state.player.charms.includes('banner') && state.player.bannerWaveRestores < 3) {
      const before = state.player.count;
      state.player.count = Math.min(state.player.maxCount, state.player.count + (state.difficulty === 'hard' ? 1 : 2));
      if (state.player.count > before) {
        state.player.bannerWaveRestores++;
        state.stats.bannerRestores += state.player.count - before;
        addText(enemy.nx, enemy.y + 20, `旗+${state.player.count - before}`, COLORS.indigo, .55, 18, 'world');
      }
    }
    if (enemy.kind === 'splitter' && !byStamp) {
      spawnMite(enemy.nx, enemy.y, -1);
      spawnMite(enemy.nx, enemy.y, 1);
    }
    if (enemy.isBoss) bossDefeated();
    else sfx('kill', .3, 1 + Math.min(.35, state.combo * .008));
  }

  function bossPatternRequirement(boss) {
    if (!boss || !boss.isBoss) return 0;
    if (boss.bossType === 'dragon') {
      // The last boss must read as a climax rather than a build-stat receipt.
      // Normal shows one full lesson, then two confirmations. Hard asks the
      // player to survive alternate versions of the second and final tests.
      if (state.difficulty === 'hard') return boss.phaseStage === 0 ? 2 : 3;
      return boss.phaseStage === 0 ? 1 : 2;
    }
    if (state.difficulty === 'hard' && boss.bossType === 'cart' && boss.phaseStage === 2) return 2;
    return 1;
  }

  function bossDamageFloor(boss) {
    if (!boss || !boss.isBoss) return 0;
    if (boss.phaseStage === 0) return boss.maxHp * .67;
    if (boss.phaseStage === 1) return boss.maxHp * .34;
    return boss.attacksInStage < bossPatternRequirement(boss) ? 1 : 0;
  }

  function applyBossRawDamage(boss, amount) {
    if (!boss || boss.dead || boss.lockTime > 0 || boss.stageLock > 0 || boss.attackPending) return 0;
    const floor = bossDamageFloor(boss);
    const before = boss.hp;
    boss.hp = Math.max(floor, boss.hp - amount);
    return before - boss.hp;
  }

  function spawnBoss() {
    const type = actData().boss;
    const hpBase = { cart: 2200, mask: 4700, dragon: 8500 }[type];
    const hp = hpBase * modeRules().bossHp;
    const deadlineBase = { cart: 42, mask: 50, dragon: 62 }[type];
    const boss = {
      id: `${state.generation}:boss:${state.act}`,
      kind: 'boss', isBoss: true, bossType: type,
      nx: .5, baseNx: .5, x: nxToX(.5), y: state.layout.track.top + 92,
      radius: type === 'dragon' ? 60 : type === 'mask' ? 55 : 54,
      hp, maxHp: hp, speed: 0, damage: Math.ceil((7 + state.act * 2) * modeRules().enemyDamage),
      score: 1700 * state.act * (state.difficulty === 'hard' ? 1.35 : 1), phase: 0, phaseStage: 0, flash: 0, dead: false,
      attackTimer: .12, attackIndex: 0, attacksInStage: 0, attackPending: true,
      openLane: state.gameplayRng.chance(.5) ? 'left' : 'right', shieldShift: 1.2,
      lockTime: .74, stageLock: 0, enteredAt: state.runTime,
      fightTime: 0, rage: 0, pressureStage: 0,
      deadline: deadlineBase * (state.difficulty === 'hard' ? .92 : 1),
      homeY: state.layout.track.top + 92,
    };
    state.boss = boss;
    state.enemies.push(boss);
    state.mode = 'boss';
    setPhase('bossFight');
    addText(.5, state.viewH * .31, `${state.difficulty === 'hard' ? '烈・' : ''}${type === 'cart' ? '鬼車' : type === 'mask' ? '屏風面' : '紙龍'}`, COLORS.redDark, 1.15, 43, 'center');
    updateControls();
  }

  function spawnSweep(lane, width = .34, delay = .78, damage = 6) {
    const center = lane === 'left' ? .25 : lane === 'right' ? .75 : lane;
    const active = state.difficulty === 'hard' ? .42 : .46;
    state.hazards.push({
      kind: 'sweep', nx: center, x: nxToX(center), width, life: delay + active, maxLife: delay + active,
      warning: delay, active, damage, hit: false, dead: false,
    });
  }

  function bossAttack(boss) {
    boss.attackIndex++;
    boss.attacksInStage++;
    boss.attackPending = false;
    const hard = state.difficulty === 'hard';
    const stage = boss.phaseStage;
    state.stats.bossPatterns.push(`${boss.bossType}:${stage}:${boss.attackIndex}`);

    if (boss.bossType === 'cart') {
      if (stage === 0) {
        const lane = boss.attackIndex % 2 ? 'left' : 'right';
        spawnSweep(lane, .38, hard ? .66 : .82, 6);
        const flank = lane === 'left' ? .72 : .28;
        for (let i = 0; i < (hard ? 4 : 3); i++) spawnEnemy({ kind: 'fast', nx: clamp(flank + (i - 1.5) * .065, .08, .92), scale: 1.02 + state.act * .04, phase: i, depth:.03 });
        if (hard) spawnEnemy({kind:'charger',nx:flank,scale:1.06,aim:.62,depth:.04});
      } else if (stage === 1) {
        spawnSweep('left', .28, hard ? .64 : .78, 6);
        spawnSweep('right', .28, hard ? .94 : 1.10, 6);
        for (let i = 0; i < 4; i++) spawnEnemy({kind:'fast',nx:.36+i*.09,scale:1.06,phase:i,depth:.04});
        if (hard) spawnEnemy({kind:'charger',nx:.5,scale:1.10,aim:.58,depth:.05});
      } else {
        spawnSweep(.5, .22, hard ? .58 : .72, 7);
        const side = boss.attackIndex % 2 ? 'left' : 'right';
        spawnSweep(side, .30, hard ? .92 : 1.12, 7);
        spawnEnemy({kind:'charger',nx:side==='left'?.72:.28,scale:1.15,aim:hard?.55:.68,depth:.06});
        if (hard) for (let i=0;i<4;i++) spawnEnemy({kind:'fast',nx:i%2?.18:.82,scale:1.10,phase:i,depth:.02});
      }
      boss.attackTimer = hard ? 1.74 : 2.15;
    } else if (boss.bossType === 'mask') {
      boss.openLane = boss.openLane === 'left' ? 'right' : 'left';
      boss.shieldShift = .58;
      const closed = boss.openLane === 'left' ? 'right' : 'left';
      spawnSweep(closed, stage === 2 ? .36 : .31, hard ? .66 : .86, 5 + stage);
      if (stage >= 1) spawnSweep(.5, .16, hard ? .92 : 1.16, 5 + stage);
      const shots = (hard ? 3 : 2) + (stage === 2 ? 1 : 0);
      for (let i = 0; i < shots; i++) spawnEnemyShot({ nx: .20 + i * (.60 / Math.max(1, shots - 1)), y: boss.y + 22, radius: 12 }, 'bossFire');
      if (stage === 2) spawnEnemy({kind: hard ? 'charger' : 'fast',nx:boss.openLane==='left'?.28:.72,scale:1.18,aim:.62,depth:.05});
      boss.attackTimer = hard ? 1.82 : 2.30;
    } else {
      if (stage === 0) {
        const first = boss.attackIndex % 2 ? 'left' : 'right';
        const second = first === 'left' ? 'right' : 'left';
        spawnSweep(first, .29, hard ? .66 : .80, 7);
        spawnSweep(second, .29, hard ? .94 : 1.12, 7);
        for (let i=0;i<(hard?4:3);i++) spawnEnemyShot({nx:.24+i*(.52/Math.max(1,(hard?3:2))),y:boss.y+30,radius:12},'bossFire');
      } else if (stage === 1) {
        const alternate = boss.attacksInStage % 2 === 0;
        if (!alternate) {
          const shots = hard ? 7 : 5;
          for (let i = 0; i < shots; i++) spawnEnemyShot({ nx: .10 + i * (.80 / (shots - 1)), y: boss.y + 30, radius: 12 }, 'bossFire');
          spawnEnemy({kind:'charger',nx:boss.attackIndex%2?.28:.72,scale:1.18,aim:hard?.56:.68,depth:.04});
          if (hard) spawnSweep(.5,.17,.92,7);
        } else {
          const first = boss.attackIndex % 2 ? 'left' : 'right';
          const second = first === 'left' ? 'right' : 'left';
          spawnSweep(first, .35, hard ? .60 : .78, 7);
          spawnSweep(second, .35, hard ? .96 : 1.14, 7);
          spawnEnemy({kind:'shield',nx:first==='left'?.72:.28,scale:1.20,shieldSide:first==='left'?-1:1,depth:.05});
          if (hard) spawnEnemy({kind:'charger',nx:first==='left'?.28:.72,scale:1.16,aim:.58,depth:.03});
        }
      } else {
        const alternate = boss.attacksInStage % 2 === 0;
        if (!alternate) {
          spawnEnemy({ kind: 'armor', nx: .28, scale: 1.36, depth:.04 });
          spawnEnemy({ kind: 'shield', nx: .72, scale: 1.36, shieldSide: -1, depth:.04 });
          spawnEnemy({ kind: 'drummer', nx: .5, scale: 1.24, holdDepth:.26, pulses: hard ? 2 : 1, depth:.02 });
          for (let i = 0; i < (hard ? 6 : 4); i++) spawnEnemy({ kind: 'fast', nx: i % 2 ? .20 : .80, scale: 1.24, phase: i, depth:.04 });
          spawnSweep(.5, .18, hard ? .70 : .94, 8);
        } else {
          const shots = hard ? 6 : 4;
          for (let i = 0; i < shots; i++) spawnEnemyShot({nx:.14+i*(.72/Math.max(1,shots-1)),y:boss.y+30,radius:12},'bossFire');
          spawnSweep('left', .25, hard ? .62 : .82, 8);
          spawnSweep('right', .25, hard ? .96 : 1.16, 8);
          spawnEnemy({kind:'charger',nx:.30,scale:1.24,aim:hard?.54:.66,depth:.04});
          spawnEnemy({kind:'charger',nx:.70,scale:1.24,aim:hard?.54:.66,depth:.04});
        }
      }
      boss.attackTimer = hard ? Math.max(1.48, 1.92 - stage * .12) : Math.max(1.78, 2.28 - stage * .16);
    }
    sfx('boss', .34, 1 + stage * .08);
  }

  function updateBoss(boss, dt) {
    if (!boss || boss.dead) return;
    boss.fightTime += dt;
    boss.rage = clamp((boss.fightTime - boss.deadline * .55) / (boss.deadline * .45), 0, 1);
    boss.lockTime = Math.max(0, boss.lockTime - dt);
    boss.stageLock = Math.max(0, boss.stageLock - dt);
    boss.shieldShift = Math.max(0, boss.shieldShift - dt);

    if (boss.rage >= .52 && boss.pressureStage < 1) {
      boss.pressureStage = 1;
      addText(boss.nx, boss.y + boss.radius + 48, '迫', COLORS.redDark, .95, 34, 'world');
      sfx('boss', .7, .72);
    }
    if (boss.fightTime >= boss.deadline && boss.pressureStage < 2) {
      boss.pressureStage = 2;
      boss.attackTimer = Math.min(boss.attackTimer, .22);
      addText(boss.nx, boss.y + boss.radius + 54, '鬼迫', COLORS.redDark, 1.15, 42, 'world');
      state.shake = Math.max(state.shake, 10);
      sfx('boom', .8, .7);
      haptic([45, 25, 55]);
    }

    const press = clamp((boss.fightTime - boss.deadline) / (state.difficulty === 'hard' ? 10 : 12), 0, 1);
    boss.y = lerp(boss.homeY, state.layout.playerY - boss.radius - 34, press * press);
    if (press >= 1 && state.phase === 'bossFight') {
      hurtPlayer(Math.max(12, state.player.count), 'press', boss.nx, state.player.y);
      return;
    }

    const t = state.simTime * modeRules().bossSpeed;
    if (boss.bossType === 'cart') boss.nx = .5 + Math.sin(t * .82) * .27;
    else if (boss.bossType === 'mask') boss.nx = .5 + Math.sin(t * .42) * .08;
    else boss.nx = .5 + Math.sin(t * 1.06) * .29;
    boss.x = nxToX(boss.nx);

    const epsilon = boss.maxHp * .001;
    const atFold = boss.phaseStage === 0 ? boss.hp <= boss.maxHp * .67 + epsilon : boss.phaseStage === 1 ? boss.hp <= boss.maxHp * .34 + epsilon : false;
    const shouldAdvance = atFold && boss.attacksInStage >= bossPatternRequirement(boss);
    if (shouldAdvance) {
      boss.phaseStage++;
      boss.stageLock = state.difficulty === 'hard' ? .42 : .50;
      boss.attackPending = true;
      boss.attacksInStage = 0;
      boss.attackTimer = .04;
      state.shake = state.profile.settings.reducedMotion ? 2 : 11;
      state.flash = .32;
      addText(boss.nx, boss.y + 64, `折 ${boss.phaseStage + 1}`, COLORS.ochre, .9, 28, 'world');
      sfx('tier', .75, .8 + boss.phaseStage * .12);
    }

    boss.attackTimer -= dt * modeRules().bossSpeed * (1 + boss.rage * .92);
    if (boss.attackTimer <= 0 && boss.lockTime <= 0 && boss.stageLock <= 0) bossAttack(boss);
  }

  function bossDefeated() {
    const boss = state.boss;
    if (!boss || state.phase === 'bossDefeat') return;
    const time = state.runTime - boss.enteredAt;
    state.stats.bossTimes.push(time);
    state.score += Math.round((2400 * state.act + Math.max(0, 1900 - time * 48)) * (state.difficulty === 'hard' ? 1.35 : 1));
    state.sealsEarned += Math.ceil((1 + (time < (state.difficulty === 'hard' ? 18 : 15) ? 1 : 0)) * modeRules().sealScale);
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    for (const e of state.enemies) if (!e.isBoss) e.dead = true;
    state.mode = 'transition';
    setPhase('bossDefeat', state.difficulty === 'hard' ? 1.38 : 1.48);
    state.shake = state.profile.settings.reducedMotion ? 3 : 16;
    state.flash = .6;
    sfx('boom', 1.1);
    haptic([60, 30, 90]);
    updateControls();
  }

  function selectCharm(id) {
    if (state.mode !== 'choice' || !CHARM_POOL[id]) return;
    if (!state.player.charms.includes(id)) state.player.charms.push(id);
    if (id === 'knot') addMomentum(10, 'charm');
    sfx('choice', .8);
    haptic(24);
    state.act++;
    state.stats.actReached = state.act;
    state.encounterIndex = 0;
    state.bossPrepared = false;
    state.encounters = makeActEncounters(state.act);
    if (state.player.charms.includes('rice')) {
      const before = state.player.count;
      state.player.count = Math.min(state.player.maxCount, state.player.count + Math.ceil(state.player.maxCount * .10));
      if (state.player.count > before) addText(.5, state.viewH * .52, `米 +${state.player.count - before}`, COLORS.green, .9, 27, 'center');
    }
    state.player.shield = Math.min(state.player.maxShield, state.player.shield + 1);
    state.mode = 'playing';
    showOverlay(null);
    setPhase('actIntro', state.difficulty === 'hard' ? 1.28 : 1.40);
    addText(.5, state.viewH * .43, state.difficulty === 'hard' ? `烈・${ACT_DATA[state.act].subtitle}` : ACT_DATA[state.act].subtitle, COLORS.redDark, 1.3, 38, 'center');
    updateControls();
  }

  function makeCharmOptions() {
    const owned = new Set(state.player.charms);
    const available = Object.keys(CHARM_POOL).filter(id => !owned.has(id));
    const defense = available.filter(id => ['bell', 'rice', 'crane'].includes(id));
    const gate = available.filter(id => ['knot', 'ink'].includes(id));
    const action = available.filter(id => ['fox', 'echo'].includes(id));
    const recovery = available.filter(id => ['banner', 'rice', 'bell'].includes(id));
    const synergyMap = {
      fan: ['banner', 'ink', 'echo'],
      spear: ['banner', 'echo', 'knot'],
      spiral: ['fox', 'bell', 'echo'],
      drum: ['fox', 'banner', 'ink'],
    };
    const synergy = available.filter(id => (synergyMap[state.player.form] || []).includes(id));
    const chosen = [];
    const take = pool => {
      const candidates = pool.filter(id => !chosen.includes(id));
      if (candidates.length) chosen.push(state.gameplayRng.pick(candidates));
    };
    const fragile = state.player.count < (state.difficulty === 'hard' ? 42 : 34) || state.player.shield <= (state.difficulty === 'hard' ? 1 : 0);
    take(synergy.length ? synergy : action);
    take(fragile ? defense.concat(recovery) : gate.concat(action));
    take(available);
    while (chosen.length < 3 && available.length) take(available);
    return chosen.slice(0, 3);
  }

  function charmVisualMarkup(id, charm) {
    return `<span class="charm-visual" aria-hidden="true"><span class="charm-icon">${charm.icon}</span><span class="charm-demo demo-${id}"><i></i><i></i><i></i><b></b><em></em></span></span>`;
  }

  function showCharmChoice() {
    state.enemies.length = 0;
    state.bullets.length = 0;
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    state.gates.length = 0;
    state.boss = null;
    state.mode = 'choice';
    showOverlay('choice');
    UI.choiceActLabel.textContent = `${state.difficulty === 'hard' ? '烈・' : ''}${actKanji[state.act - 1]}ノ幕　結`;
    UI.choiceList.innerHTML = '';
    const options = makeCharmOptions();
    options.forEach(id => {
      const charm = CHARM_POOL[id];
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'charm-card';
      button.dataset.charm = id;
      button.innerHTML = `${charmVisualMarkup(id, charm)}<h3>${charm.name}</h3><p>${charm.desc}</p><span class="charm-pips" aria-hidden="true"><i></i><i></i><i></i></span>`;
      button.addEventListener('click', () => selectCharm(id), { once: true });
      UI.choiceList.appendChild(button);
    });
    updateControls();
  }

  function deathCauseText(cause) {
    const map = {
      chaff: '群れに呑まれた', fast: '駆け鬼に抜かれた', armor: '鎧鬼を止め切れなかった',
      shield: '盾鬼に道を割られた', thrower: '投げ札を受けた', splitter: '裂け鬼に囲まれた',
      charger: '突進の印を避け損ねた', drummer: '鼓鬼の増援に押された',
      mite: '小鬼を逃した', paperBomb: '紙火を受けた', bossFire: '大技を受けた', sweep: '予兆の外へ逃げ遅れた', boss: '大鬼に押し切られた', press: '大鬼の迫りを止め切れなかった',
    };
    return map[cause] || '紙衆が尽きた';
  }

  function gradeResult(clear) {
    if (!clear) return state.stats.actReached >= 3 ? '朱' : '木';
    const perfectRatio = state.stats.waves ? state.stats.wavesNoHit / state.stats.waves : 0;
    const gateRatio = state.stats.gateHistory.length ? state.stats.tier3Gates / state.stats.gateHistory.length : 0;
    const scoreTarget = state.difficulty === 'hard' ? 105000 : 70000;
    const measure = perfectRatio * 1.9 + gateRatio * 1.45 + Math.min(1.55, state.score / scoreTarget * 1.55) + Math.min(.82, state.stats.manualStamps * .15);
    const gold = state.difficulty === 'hard' ? 4.55 : 4.28;
    const silver = state.difficulty === 'hard' ? 3.18 : 2.92;
    const goldStamps = state.difficulty === 'hard' ? 6 : 3;
    const goldGateRatio = state.difficulty === 'hard' ? .72 : .66;
    const mastered = state.stats.manualStamps >= goldStamps && gateRatio >= goldGateRatio;
    return measure >= gold && mastered ? '金' : measure >= silver ? '銀' : '朱';
  }

  function endRun(clear, cause = null) {
    if (state.result || state.mode === 'result') return;
    state.stats.deathCause = clear ? null : (cause || state.stats.deathCause);
    const grade = gradeResult(clear);
    state.result = { clear, cause: clear ? null : state.stats.deathCause, grade, score: Math.round(state.score), time: state.runTime, finalized: false };
    state.mode = 'transition';
    setPhase('resultDelay', clear ? 1.0 : .82);
    state.enemies.length = 0;
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    state.gates.length = 0;
    sfx(clear ? 'choice' : 'fail', clear ? 1 : .8, clear ? 1.2 : .65);
    updateControls();
  }

  function unlockSkins() {
    for (const skin of SKINS) {
      if (skin.hardOnly) continue;
      if (state.profile.records.totalSeals >= skin.cost && !state.profile.unlocks.skins.includes(skin.id)) state.profile.unlocks.skins.push(skin.id);
    }
  }

  function refreshModeButtons() {
    const unlocked = !!state.profile.unlocks.hard;
    UI.hardStart.classList.toggle('is-locked', !unlocked);
    UI.hardStart.setAttribute('aria-label', unlocked ? '烈祭を始める' : '百鬼祭陣を一度踏破すると烈祭が開く');
    UI.hardHint.textContent = unlocked ? '独立高難度' : '踏破で開く';
  }

  function finalizeResult() {
    const r = state.result;
    if (!r || r.finalized) return;
    r.finalized = true;
    const gradeIndex = Math.max(0, GRADE_ORDER.indexOf(r.grade));
    const gained = Math.max(1, Math.round((state.sealsEarned + gradeIndex) * modeRules().sealScale));
    r.seals = gained;
    const rec = currentRecord();
    rec.best = Math.max(rec.best, r.score);
    rec.bestGrade = GRADE_ORDER.indexOf(rec.bestGrade) >= gradeIndex ? rec.bestGrade : r.grade;
    rec.bestAct = Math.max(rec.bestAct, state.stats.actReached);
    state.profile.records.totalSeals += gained;
    let openedHard = false;
    if (r.clear) {
      rec.clears++;
      rec.bestTime = rec.bestTime > 0 ? Math.min(rec.bestTime, r.time) : r.time;
      if (state.difficulty === 'normal' && !state.profile.unlocks.hard) {
        state.profile.unlocks.hard = true;
        openedHard = true;
      }
      if (state.difficulty === 'hard' && !state.profile.unlocks.skins.includes('ember')) state.profile.unlocks.skins.push('ember');
    }
    unlockSkins();
    saveProfile();
    refreshModeButtons();

    UI.resultSeal.textContent = r.clear ? (state.difficulty === 'hard' ? '烈' : '了') : '散';
    UI.resultMode.textContent = modeRules().label;
    UI.resultMode.classList.toggle('is-hard', state.difficulty === 'hard');
    UI.resultKicker.textContent = r.clear ? `${modeRules().label}　踏破` : `${ACT_DATA[Math.min(3, state.stats.actReached)].subtitle}　道半ば`;
    UI.resultTitle.textContent = r.clear ? (openedHard ? '烈の縄が、ほどけた' : state.difficulty === 'hard' ? '烈祭を、鎮めた' : '祭は、走り切った') : '紙衆は尽きた';
    UI.resultGrade.textContent = r.grade;
    UI.resultStats.innerHTML = `
      <div class="result-stat"><b>${pretty(r.score)}</b><span>得点</span></div>
      <div class="result-stat"><b>${Math.floor(r.time / 60)}:${String(Math.floor(r.time % 60)).padStart(2, '0')}</b><span>道中</span></div>
      <div class="result-stat"><b>${state.stats.wavesNoHit}/${state.stats.waves}</b><span>無傷の波</span></div>
      <div class="result-stat"><b>+${gained}</b><span>印</span></div>`;
    UI.resultCause.textContent = r.clear ? `${openedHard ? '烈祭　解放　／　' : ''}門・参印 ${state.stats.tier3Gates}　祭印 ${state.stats.manualStamps}` : deathCauseText(r.cause);
    state.mode = 'result';
    showOverlay('result');
    updateControls();
  }

  function updatePlayer(dt) {
    const p = state.player;
    if (!p) return;
    if (input.left) p.targetNx -= dt * (.72 + p.tempo * .08);
    if (input.right) p.targetNx += dt * (.72 + p.tempo * .08);
    if (input.active) p.targetNx = input.targetNx;
    const edge = clamp(playerFootprint() / state.layout.track.width + .018, .045, .24);
    p.targetNx = clamp(p.targetNx, edge, 1 - edge);
    const before = p.nx;
    p.nx = expLerp(p.nx, p.targetNx, 14 + p.tempo * 1.7, dt);
    p.x = nxToX(p.nx);
    p.targetX = nxToX(p.targetNx);
    p.y = state.layout.playerY;
    p.moving = expLerp(p.moving, clamp(Math.abs(p.nx - before) / Math.max(dt, .001) * 1.8, 0, 1), 9, dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.stampTimer = Math.max(0, p.stampTimer - dt);
    p.echoTimer = Math.max(0, p.echoTimer - dt);
    state.comboTimer = Math.max(0, state.comboTimer - dt);
    if (state.comboTimer <= 0) state.combo = Math.max(0, state.combo - dt * 6);

    if (p.momentum >= 100) {
      p.readyTime += dt;
      const liveDanger = ['combat', 'bossFight'].includes(state.phase) && (
        state.enemies.some(enemy => !enemy.dead) || state.enemyShots.some(shot => !shot.dead) ||
        state.hazards.some(hazard => !hazard.dead && hazard.kind !== 'target')
      );
      if (modeRules().autoStamp && p.readyTime > 8.5 && liveDanger) activateStamp(false);
    } else p.readyTime = 0;

    const canShoot = ['gate', 'combat', 'bossFight'].includes(state.phase);
    if (canShoot) {
      p.fireTimer -= dt;
      while (p.fireTimer <= 0) {
        spawnVolley();
        p.fireTimer += fireCadence();
      }
    } else p.fireTimer = Math.min(p.fireTimer, .08);

    if (state.phase === 'gate' && state.gates.length) {
      const previous = state.focusGateId;
      let lane = state.gates.find(g => g.id === previous)?.lane || null;
      const dead = state.difficulty === 'hard' ? .065 : .055;
      if (p.nx < .5 - dead) lane = 'left';
      else if (p.nx > .5 + dead) lane = 'right';
      else lane = null;
      const focus = lane ? state.gates.find(g => g.lane === lane) : null;
      state.focusGateId = focus?.id || null;
      if (previous && state.focusGateId && previous !== state.focusGateId) state.stats.focusSwitches++;
      state.gates.forEach(g => { g.selected = g.id === state.focusGateId; });
    }
  }

  function updateGatePhase(dt) {
    const t = clamp(state.phaseTimer / state.phaseDuration, 0, 1);
    const topY = state.layout.track.top + state.layout.gateH * .55;
    const endY = state.layout.playerY + state.layout.gateH * .66;
    const y = lerp(topY, endY, t);
    for (const gate of state.gates) {
      gate.y = y;
      gate.x = nxToX(gate.nx);
      if (!gate.selected && gate.charge > 0) {
        const before = gate.charge;
        gate.charge = Math.max(0, gate.charge - modeRules().gateDecay * dt);
        state.stats.gateChargeWaste += before - gate.charge;
      }
      gate.tier = chargeTier(gate.charge);
      if (gate.tier < gate.previousTier) gate.previousTier = gate.tier;
      if (gate.tier > gate.previousTier) {
        gate.previousTier = gate.tier;
        sfx('tier', .62, .9 + gate.tier * .12);
        haptic(gate.selected ? 12 : 0);
        addParticle(gate.nx, gate.y, gate.option.style.color, 8 + gate.tier * 3, .55);
      }
    }
    if (t >= 1) resolveGate();
  }

  function spawnScheduleEvent(event) {
    if (event.type === 'enemy') {
      spawnEnemy(event);
      return;
    }
    if (event.type === 'sweep') {
      spawnSweep(event.lane, event.width, event.warning, Math.ceil(event.damage * modeRules().enemyDamage));
      return;
    }
    if (event.type === 'beat') {
      state.currentEncounter.lastBeat = event.index;
      state.stats.beatsSeen++;
      const mark = ['一', '二', '三', '結'][event.index] || '拍';
      addText(.5, state.layout.hudH + 122, mark, state.act === 3 ? COLORS.paperHi : COLORS.ochreDark, .48, 23, 'center');
      sfx('click', .25, 1 + event.index * .08);
    }
  }

  function updateWaveSpawner(dt) {
    const encounter = state.currentEncounter;
    if (!encounter || !encounter.schedule) return;
    const liveEnemies = state.enemies.reduce((n, enemy) => n + (!enemy.dead && !enemy.isBoss ? 1 : 0), 0);
    const liveDanger = state.enemyShots.reduce((n, shot) => n + (!shot.dead ? 1 : 0), 0) + state.hazards.reduce((n, h) => n + (!h.dead && h.kind !== 'target' && h.kind !== 'chargeMark' ? 1 : 0), 0);
    const next = encounter.schedule[encounter.cursor];
    let pace = 1;
    if (liveEnemies + liveDanger > modeRules().concurrency) pace = modeRules().crowdedPace;
    else if (liveEnemies + liveDanger === 0 && next && next.t - encounter.elapsed > .48) pace = modeRules().emptyPace;
    encounter.elapsed += dt * pace;
    while (encounter.cursor < encounter.schedule.length && encounter.schedule[encounter.cursor].t <= encounter.elapsed) {
      spawnScheduleEvent(encounter.schedule[encounter.cursor++]);
    }
  }

  function damageEnemy(enemy, bullet) {
    if (enemy.dead) return false;
    let damage = bullet.damage;
    const p = state.player;

    if (enemy.isBoss) {
      if (enemy.lockTime > 0 || enemy.stageLock > 0 || enemy.attackPending) {
        addParticle(bullet.nx, bullet.y, COLORS.white, 2, .35);
        return true;
      }
      damage *= .82;
      if (enemy.bossType === 'mask') {
        // The test is whether the player committed to the open half. Using
        // each projectile's spread here made wide/defensive formations lose
        // damage even after the player read the lane correctly.
        const playerLane = p.nx < .5 ? 'left' : 'right';
        if (playerLane !== enemy.openLane) {
          damage *= .09;
          addParticle(bullet.nx, bullet.y, COLORS.green, 3, .4);
          sfx('shield', .18, 1.25);
        }
      }
    }

    if (enemy.kind === 'armor') {
      if (bullet.form === 'spear') damage *= 2.45 + p.mastery.spear * .20;
      else damage *= .42;
    }
    if (enemy.kind === 'shield' && enemy.shieldHp > 0) {
      const protectedSide = enemy.shieldSide < 0 ? bullet.nx < enemy.nx : bullet.nx > enemy.nx;
      if (protectedSide && bullet.form !== 'spear' && bullet.form !== 'drum') {
        enemy.shieldHp -= damage;
        damage = 0;
        addParticle(bullet.nx, bullet.y, COLORS.green, 3, .4);
      } else if (bullet.form === 'spear') {
        enemy.shieldHp -= damage * 1.6;
        damage *= .8;
      } else if (bullet.form === 'drum') {
        enemy.shieldHp -= damage * 2.2;
        damage *= .72;
      }
    }
    if (bullet.form === 'fan' && ['chaff', 'splitter', 'mite'].includes(enemy.kind)) damage *= 1.27 + p.mastery.fan * .06;
    if (bullet.stamp) damage *= 1.08;

    if (enemy.isBoss) damage = Math.min(damage, Math.max(0, enemy.hp - bossDamageFloor(enemy)));
    enemy.hp -= damage;
    enemy.flash = .09;
    state.stats.hits++;
    if (bullet.form === 'drum' && !enemy.isBoss) {
      enemy.y -= 8 + p.mastery.drum * 4;
      const splash = FORM.drum.splash + p.mastery.drum * 10;
      for (const other of state.enemies) {
        if (other === enemy || other.dead || other.isBoss) continue;
        if (dist2(enemy.x, enemy.y, other.x, other.y) < splash * splash) {
          other.hp -= damage * .28;
          other.flash = .05;
          if (other.hp <= 0) killEnemy(other, bullet.stamp);
        }
      }
    }
    if (enemy.hp <= 0) killEnemy(enemy, bullet.stamp);
    return true;
  }

  function buildEnemyBuckets() {
    const buckets = new Map();
    const band = 84;
    for (const enemy of state.enemies) {
      if (enemy.dead) continue;
      const key = Math.floor(enemy.y / band);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(enemy);
    }
    return { buckets, band };
  }

  function updateBullets(dt) {
    const index = buildEnemyBuckets();
    for (const bullet of state.bullets) {
      if (bullet.dead) continue;
      bullet.age += dt;
      bullet.nx += bullet.vx * dt;
      bullet.x = nxToX(bullet.nx);
      bullet.y += bullet.vy * dt;

      if (bullet.gateId) {
        const gate = state.gates.find(g => g.id === bullet.gateId && !g.dead);
        if (!gate) { bullet.dead = true; continue; }
        if (bullet.y <= gate.y + state.layout.gateH * .42) {
          const before = gate.charge;
          gate.charge = Math.min(gateThreshold(2) + 35, gate.charge + bullet.gateCharge);
          if (before >= gateThreshold(2)) {
            if (state.player.charms.includes('ink')) {
              addMomentum(bullet.gateCharge * .045, 'overflow');
              addScore(bullet.gateCharge * 2);
            } else addMomentum(bullet.gateCharge * .012, 'overflow');
          }
          bullet.dead = true;
          addParticle(gate.nx, gate.y + state.layout.gateH * .18, gate.option.style.color, 1, .3);
        }
        continue;
      }

      const key = Math.floor(bullet.y / index.band);
      let hit = false;
      for (let k = key - 1; k <= key + 1 && !hit; k++) {
        const list = index.buckets.get(k);
        if (!list) continue;
        for (const enemy of list) {
          if (enemy.dead) continue;
          const rr = enemy.radius + bullet.radius;
          if (dist2(bullet.x, bullet.y, enemy.x, enemy.y) <= rr * rr) {
            damageEnemy(enemy, bullet);
            if (bullet.pierce > 0) bullet.pierce--;
            else bullet.dead = true;
            hit = true;
            break;
          }
        }
      }
      if (bullet.y < state.layout.track.top - 80 || bullet.nx < -.16 || bullet.nx > 1.16 || bullet.age > 2.4) bullet.dead = true;
    }
    state.bullets = state.bullets.filter(b => !b.dead);
  }

  function registerNearMiss(nx, y) {
    state.stats.nearMisses++;
    addMomentum(4.2, 'near');
    addScore(45, nx, y, '際');
    sfx('near', .34, 1.1);
  }

  function updateEnemies(dt) {
    const p = state.player;
    const footprint = playerFootprint();
    for (const enemy of state.enemies) {
      if (enemy.dead) continue;
      enemy.flash = Math.max(0, enemy.flash - dt);
      enemy.entryTimer = Math.max(0, (enemy.entryTimer || 0) - dt);
      if (enemy.hp <= 0) { killEnemy(enemy, true); continue; }
      if (enemy.isBoss) {
        updateBoss(enemy, dt);
        continue;
      }

      let moved = false;
      if (enemy.kind === 'fast') enemy.nx = clamp(enemy.baseNx + Math.sin(state.simTime * 5.6 + enemy.phase) * .105, .04, .96);
      else if (enemy.kind === 'splitter') enemy.nx = clamp(enemy.baseNx + Math.sin(state.simTime * 2.2 + enemy.phase) * .035, .04, .96);

      if (enemy.kind === 'charger') {
        if (enemy.chargeState === 'aim') {
          enemy.y += enemy.speed * .34 * dt;
          enemy.chargeTimer -= dt;
          if (!enemy.chargeMarked && enemy.chargeTimer <= .62) {
            enemy.chargeMarked = true;
            enemy.lockedNx = Number.isFinite(enemy.lockedNx) ? enemy.lockedNx : clamp(p.nx, .07, .93);
            state.hazards.push({
              kind: 'chargeMark', sourceId: enemy.id, nx: enemy.lockedNx, x: nxToX(enemy.lockedNx), width: .13,
              life: .76, maxLife: .76, dead: false,
            });
            addText(enemy.lockedNx, p.y - 90, '矢', COLORS.redDark, .45, 22, 'world');
            sfx('near', .24, .72);
          }
          if (enemy.chargeTimer <= 0) {
            enemy.chargeState = 'dash';
            enemy.baseNx = Number.isFinite(enemy.lockedNx) ? enemy.lockedNx : enemy.nx;
            enemy.nx = enemy.baseNx;
            state.shake = Math.max(state.shake, state.profile.settings.reducedMotion ? 1 : 3);
            sfx('drum', .28, 1.16);
          }
          moved = true;
        } else {
          enemy.nx = enemy.baseNx;
          enemy.y += enemy.dashSpeed * dt;
          moved = true;
        }
      } else if (enemy.kind === 'drummer') {
        if (Number.isFinite(enemy.holdY) && enemy.y >= enemy.holdY && enemy.pulses > 0) {
          enemy.y = enemy.holdY;
          enemy.attackTimer -= dt;
          if (enemy.attackTimer <= 0) {
            spawnReinforcement(enemy);
            enemy.attackTimer = state.difficulty === 'hard' ? 1.78 : 2.18;
          }
        } else {
          // A drummer is an interruptible tempo threat, not a permanent turret.
          // After its authored pulses it rejoins the procession so a narrow
          // formation cannot leave the encounter in a harmless soft-lock.
          enemy.y += enemy.speed * (enemy.pulses > 0 ? 1 : 1.22) * dt;
        }
        moved = true;
      } else if (enemy.kind === 'thrower' && Number.isFinite(enemy.holdY) && enemy.y >= enemy.holdY && enemy.pulses > 0) {
        enemy.y = enemy.holdY;
        moved = true;
      }

      if (!moved) enemy.y += enemy.speed * dt;
      enemy.x = nxToX(enemy.nx);

      if (enemy.kind === 'thrower') {
        const limitedVolley = Number.isFinite(enemy.holdY);
        if (!limitedVolley || enemy.pulses > 0) {
          enemy.attackTimer -= dt;
          if (enemy.attackTimer <= 0 && enemy.y < p.y - 124) {
            spawnEnemyShot(enemy);
            if (limitedVolley) enemy.pulses--;
            enemy.attackTimer = state.difficulty === 'hard' ? 1.62 : 2.02;
          }
        }
      }

      if (enemy.y + enemy.radius >= p.y - 20) {
        const dx = Math.abs(enemy.x - p.x);
        if (dx <= footprint + enemy.radius * .55) {
          enemy.dead = true;
          hurtPlayer(enemy.damage, enemy.kind, enemy.nx, enemy.y);
        } else if (!enemy.nearChecked && dx <= footprint + enemy.radius + 48) {
          enemy.nearChecked = true;
          registerNearMiss(enemy.nx, p.y - 30);
        }
        if (enemy.y > p.y + enemy.radius + 24) enemy.dead = true;
      }
    }
    state.enemies = state.enemies.filter(e => !e.dead || (e.isBoss && state.phase === 'bossDefeat'));
  }

  function updateEnemyShots(dt) {
    const p = state.player;
    const footprint = playerFootprint();
    for (const shot of state.enemyShots) {
      if (shot.dead) continue;
      shot.age += dt;
      shot.nx += shot.vx * dt;
      shot.x = nxToX(shot.nx);
      shot.y += shot.vy * dt;
      if (spiralIntercept(shot)) continue;
      if (shot.y + shot.radius >= p.y - 16) {
        const dx = Math.abs(shot.x - p.x);
        if (dx <= footprint * .72 + shot.radius) {
          shot.dead = true;
          hurtPlayer(shot.damage, shot.kind, shot.nx, shot.y);
        } else if (!shot.nearChecked && dx <= footprint + shot.radius + 42) {
          shot.nearChecked = true;
          registerNearMiss(shot.nx, p.y - 26);
        }
        if (shot.y > p.y + 50) shot.dead = true;
      }
      if (shot.age > 5) shot.dead = true;
    }
    state.enemyShots = state.enemyShots.filter(s => !s.dead);
  }

  function updateHazards(dt) {
    const p = state.player;
    const footprintN = playerFootprint() / Math.max(1, state.layout.track.width);
    for (const h of state.hazards) {
      if (h.dead) continue;
      h.life -= dt;
      if (h.kind === 'target') {
        if (h.life <= 0) h.dead = true;
        continue;
      }
      if (h.kind === 'chargeMark') {
        const source = state.enemies.find(enemy => enemy.id === h.sourceId && !enemy.dead);
        if (!source || h.life <= 0) h.dead = true;
        continue;
      }
      if (h.kind === 'sweep') {
        const elapsed = h.maxLife - h.life;
        const active = elapsed >= h.warning;
        if (active && !h.hit && Math.abs(p.nx - h.nx) <= h.width * .5 + footprintN * .55) {
          h.hit = true;
          hurtPlayer(h.damage, 'sweep', h.nx, p.y);
        }
        if (h.life <= 0) h.dead = true;
      }
    }
    state.hazards = state.hazards.filter(h => !h.dead);
  }

  function updateParticles(dt) {
    for (const p of state.particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 90 * dt;
      p.angle += p.spin * dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);
    for (const t of state.texts) {
      t.life -= dt;
      t.y += t.vy * dt;
      if (t.space === 'world') t.x = nxToX(t.nx);
    }
    state.texts = state.texts.filter(t => t.life > 0);
  }

  function checkWaveComplete(dt) {
    const encounter = state.currentEncounter;
    if (!encounter || encounter.cursor < encounter.schedule.length) return;
    const enemiesRemain = state.enemies.some(e => !e.dead && !e.isBoss);
    const dangerRemain = state.enemyShots.some(s => !s.dead) || state.hazards.some(h => !h.dead && h.kind !== 'target');
    if (!enemiesRemain && !dangerRemain) {
      encounter.clearTimer = (encounter.clearTimer || 0) + dt;
      if (encounter.clearTimer >= .42) finishWave();
    } else encounter.clearTimer = 0;
  }

  function updateActive(dt) {
    state.runTime += dt;
    state.simTime += dt;
    state.phaseTimer += dt;
    state.shake = Math.max(0, state.shake - dt * 22);
    state.flash = Math.max(0, state.flash - dt * 2.3);
    state.scroll += dt * (120 + state.act * 16) * state.speedScale;
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) UI.toast.classList.remove('is-active');
    }
    musicTick(dt);
    updatePlayer(dt);

    if (state.phase === 'actIntro') {
      if (state.phaseTimer >= state.phaseDuration) beginEncounter();
    } else if (state.phase === 'gate') {
      updateGatePhase(dt);
      updateBullets(dt);
    } else if (state.phase === 'gateResolve') {
      updateBullets(dt);
      if (state.phaseTimer >= state.phaseDuration) {
        if (state.currentEncounter?.bossPrep) beginBossIntro();
        else beginCombat(state.currentEncounter);
      }
    } else if (state.phase === 'combat') {
      updateWaveSpawner(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateEnemyShots(dt);
      updateHazards(dt);
      checkWaveComplete(dt);
    } else if (state.phase === 'waveClear') {
      if (state.phaseTimer >= state.phaseDuration) beginEncounter();
    } else if (state.phase === 'bossIntro') {
      if (state.phaseTimer >= state.phaseDuration) spawnBoss();
    } else if (state.phase === 'bossFight') {
      updateBullets(dt);
      updateEnemies(dt);
      updateEnemyShots(dt);
      updateHazards(dt);
    } else if (state.phase === 'bossDefeat') {
      if (state.phaseTimer >= state.phaseDuration) {
        if (state.act >= state.maxActs) endRun(true);
        else showCharmChoice();
      }
    } else if (state.phase === 'resultDelay') {
      if (state.phaseTimer >= state.phaseDuration) finalizeResult();
    }

    updateParticles(dt);
    state.bullets = state.bullets.filter(b => !b.dead);
    state.enemies = state.enemies.filter(e => !e.dead || (e.isBoss && state.phase === 'bossDefeat'));
    state.enemyShots = state.enemyShots.filter(s => !s.dead);
    state.hazards = state.hazards.filter(h => !h.dead);
    if (state.player && (state.player.momentum >= 100 || UI.stampButton.classList.contains('is-ready'))) updateControls();
  }

  function roundedRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w * .5, h * .5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawPaperPolygon(points, fill, stroke = null, lineWidth = 1) {
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  }

  function drawBackground() {
    const skin = SKINS.find(s => s.id === state.profile.settings.skin) || SKINS[0];
    const act = ACT_DATA[state.act] || ACT_DATA[1];
    const tr = state.layout.track;
    const t = state.renderTime;
    const scroll = state.mode === 'title' ? t * 42 : state.scroll;

    ctx.fillStyle = skin.paper;
    ctx.fillRect(0, 0, state.viewW, state.viewH);

    const sky = state.act === 3 ? act.sky : shadeHex(act.sky, state.profile.settings.skin === 'night' ? -.15 : 0);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, tr.left, state.viewH);
    ctx.fillRect(tr.right, 0, state.viewW - tr.right, state.viewH);

    ctx.fillStyle = act.road;
    ctx.fillRect(tr.left, 0, tr.width, state.viewH);
    ctx.fillStyle = 'rgba(33,27,23,.16)';
    ctx.fillRect(tr.left, 0, 3, state.viewH);
    ctx.fillRect(tr.right - 3, 0, 3, state.viewH);

    const lineGap = state.layout.short ? 78 : 104;
    ctx.save();
    ctx.strokeStyle = state.act === 3 ? 'rgba(255,240,190,.11)' : 'rgba(62,45,28,.105)';
    ctx.lineWidth = 1;
    for (let y = -lineGap; y < state.viewH + lineGap; y += lineGap) {
      const yy = y + wrap(scroll, lineGap);
      ctx.beginPath();
      ctx.moveTo(tr.left + 7, yy);
      ctx.lineTo(tr.right - 7, yy - 10);
      ctx.stroke();
    }
    for (let i = 1; i < 4; i++) {
      const x = tr.left + tr.width * i / 4;
      ctx.setLineDash([18, 28]);
      ctx.beginPath();
      ctx.moveTo(x, tr.top);
      ctx.lineTo(x, state.viewH);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();

    drawScenery(scroll, act);

    ctx.save();
    ctx.globalAlpha = .055;
    ctx.fillStyle = COLORS.ink;
    const dots = state.quality.level === 'low' ? 34 : 70;
    for (let i = 0; i < dots; i++) {
      const x = wrap(i * 173.17, state.viewW);
      const y = wrap(i * 91.31 + scroll * .08, state.viewH);
      const r = 1 + ((i * 7) % 3);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawScenery(scroll, act) {
    const tr = state.layout.track;
    const gap = 150;
    const offset = wrap(scroll * .62, gap);
    ctx.save();
    for (let i = -1; i < Math.ceil(state.viewH / gap) + 2; i++) {
      const y = i * gap + offset;
      const leftX = tr.left * .5;
      const rightX = tr.right + (state.viewW - tr.right) * .5;
      if (state.act === 1) {
        drawRoof(leftX, y, .75 + (i % 2) * .12, i % 2 ? COLORS.redDark : COLORS.indigo2);
        drawRoof(rightX, y + 58, .68, i % 2 ? COLORS.indigo2 : COLORS.redDark);
      } else if (state.act === 2) {
        drawPine(leftX, y, .82, act.side);
        drawPine(rightX, y + 54, .7, act.side);
        if (i % 3 === 0) drawTorii(i % 2 ? leftX : rightX, y + 90, .55);
      } else {
        drawLantern(leftX, y, .72, i % 2 ? COLORS.ochre : COLORS.red);
        drawLantern(rightX, y + 66, .65, i % 2 ? COLORS.red : COLORS.ochre);
      }
    }
    ctx.restore();
  }

  function drawRoof(x, y, s, color) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(33,27,23,.18)'; ctx.fillRect(-42, 22, 84, 42);
    drawPaperPolygon([[-58, 18], [0, -10], [58, 18], [42, 31], [-44, 31]], color, COLORS.ink, 2);

  function followerPoint(i, count, form, mastery) {

      return { x: (col - (cols - 1) / 2) * 12, y: 20 + row * 12 };
    }
    if (form === 'spiral') {
      const ring = Math.floor(i / 10) + 1;

    ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(state.player.x, state.player.y + 10); ctx.stroke();
    ctx.restore();
  }

  function drawAttract() {
    const tr = state.layout.track;
    const t = state.renderTime;
    const y = state.viewH * .72 + Math.sin(t * 1.2) * 5;
    ctx.save(); ctx.globalAlpha = .28;
    for (let i = 0; i < 12; i++) {

  function render() {
    const reduced = state.profile.settings.reducedMotion;
    const shake = reduced ? 0 : state.shake;
    const sx = shake > 0 ? Math.sin(state.renderTime * 61) * shake * .52 + Math.sin(state.renderTime * 37) * shake * .2 : 0;
    const sy = shake > 0 ? Math.cos(state.renderTime * 53) * shake * .37 : 0;

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();
    drawPaperGrain();
    drawSpeedCuts();
    drawContactShadows();
    if (state.mode === 'title') drawAttract();
    if (state.player) {
      drawThreatPreview();
      drawGateFocus();
      drawHazards();
      for (const gate of state.gates) drawGate(gate);
      drawBullets();
      const liveCount = state.enemies.reduce((n, enemy) => n + ((!enemy.dead || enemy.isBoss) ? 1 : 0), 0);
      const denseThreshold = state.quality.level === 'low' ? 48 : 88;
      if (liveCount > denseThreshold) {
        ctx.save();
        for (const enemy of state.enemies) {
          if (enemy.dead && !enemy.isBoss) continue;
          if (enemy.isBoss) drawEnemy(enemy); else drawEnemyLite(enemy);
        }
        ctx.restore();
      } else {
        for (const enemy of state.enemies) if (!enemy.dead || enemy.isBoss) drawEnemy(enemy);
      }
      drawEnemyShots();
      drawPlayer();
      drawFirstGateGuide();
      drawParticles();
      drawTexts();
      drawHUD();
      drawPhaseCallout();
    }
    drawVignette();
    drawBossCurtain();
    ctx.restore();

    if (state.flash > 0) {

    }

  // V4 presentation layer: paper-cut theatre depth, staged cues and graded feedback.
  const visualState = { lastPhase: '', lastAct: 0, phasePulse: 0, actPulse: 0 };

  function drawPaperGrain() {
    if (state.quality.level === 'low') return;
    ctx.save();
    ctx.globalAlpha = state.profile.settings.reducedMotion ? .035 : .05;
    ctx.fillStyle = COLORS.ink;
    const step = 31;
    const drift = state.profile.settings.reducedMotion ? 0 : (state.renderTime * 5) % step;
    for (let y = -step + drift; y < state.viewH + step; y += step) {
      for (let x = ((Math.floor(y / step) & 1) ? 13 : 0); x < state.viewW; x += step) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        const r = n - Math.floor(n);
        ctx.fillRect(x + r * 11, y + r * 5, r > .78 ? 2 : 1, 1);
      }
    }
    ctx.globalAlpha = .025;
    ctx.strokeStyle = COLORS.ink2;
    ctx.lineWidth = 1;
    for (let y = 18; y < state.viewH; y += 47) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(state.viewW*.3,y+2,state.viewW*.7,y-2,state.viewW,y+1); ctx.stroke();
    }
    ctx.restore();
  }

  function drawContactShadows() {
    if (!state.player) return;
    ctx.save();
    ctx.globalAlpha = .12;
    ctx.fillStyle = COLORS.ink;
    for (const e of state.enemies) {
      if (e.dead || e.y < state.layout.track.top - 40 || e.y > state.viewH + 30) continue;
      const rx = e.radius * (e.isBoss ? 1.35 : .85);
      ctx.beginPath(); ctx.ellipse(e.x + 6, e.y + e.radius*.78, rx, Math.max(3,e.radius*.22), 0, 0, TAU); ctx.fill();
    }
    const p = state.player;
    ctx.globalAlpha = .16;
    ctx.beginPath(); ctx.ellipse(p.x+5,p.y+38,Math.max(22, Math.min(86, 22 + Math.sqrt(p.count) * 4.2)),8,0,0,TAU);ctx.fill();
    ctx.restore();
  }

  function drawSpeedCuts() {
    if (state.profile.settings.reducedMotion || !['combat','bossFight'].includes(state.phase)) return;
    const intensity = clamp((state.enemies.length + state.enemyShots.length*.6) / 42, 0, 1);
    if (intensity < .18) return;
    ctx.save(); ctx.globalAlpha = .045 + intensity*.075; ctx.strokeStyle = state.difficulty==='hard'?COLORS.redDark:COLORS.ink2; ctx.lineWidth=1.2;
    const cx=state.layout.track.center, cy=state.layout.playerY;
    for(let i=0;i<18;i++){
      const a=(i/18)*TAU + Math.sin(i*9.7)*.15;
      const r0=110+((i*37)%90), r1=r0+70+intensity*100;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke();

    ctx.restore();
  }

  function drawPhaseCallout() {
    const changed = visualState.lastPhase !== state.phase || visualState.lastAct !== state.act;
    if (changed) {
      visualState.phasePulse = 1;
      if (visualState.lastAct !== state.act) visualState.actPulse = 1;
      visualState.lastPhase = state.phase; visualState.lastAct = state.act;
    }
    visualState.phasePulse = Math.max(0, visualState.phasePulse - FIXED_DT*.78);
    visualState.actPulse = Math.max(0, visualState.actPulse - FIXED_DT*.48);
    const pulse = Math.max(visualState.phasePulse, visualState.actPulse);
    if (pulse <= 0 || state.mode === 'title') return;
    let title='', sub='';
    if (state.phase === 'gate') { title = state.currentEncounter?.bossPrep ? '支度' : '選札'; sub = state.currentEncounter?.name || ''; }
    else if (state.phase === 'combat') { title = state.currentEncounter?.stage || '進'; sub = state.currentEncounter?.name || ''; }
    else if (state.phase === 'bossIntro') { title = '大鬼来'; sub = ({cart:'鬼車',mask:'屏風面',dragon:'紙龍'})[ACT_DATA[state.act].boss] || ''; }
    else if (state.phase === 'bossDefeat') { title = '鎮'; sub = '一幕、結び'; }
    else if (state.phase === 'waveClear') { title = '破'; sub = '道、ひらく'; }
    if (!title) return;
    const t = 1-pulse;
    const a = Math.sin(Math.min(1,t)*Math.PI) * clamp(pulse*2.2,0,1);
    const y = state.layout.track.top + 64 + (1-a)*-16;
    ctx.save(); ctx.globalAlpha=a;
    const w=Math.min(250,state.layout.track.width*.62), h=46;
    ctx.translate(state.layout.track.center,y); ctx.rotate(-.012);
    ctx.fillStyle='rgba(248,240,220,.92)'; ctx.shadowColor='rgba(33,27,23,.25)';ctx.shadowBlur=14;ctx.shadowOffsetY=7;
    drawPaperPolygon([[-w/2+9,-h/2], [w/2,-h/2+3],[w/2-8,h/2],[-w/2,h/2-4]],'rgba(248,240,220,.94)',COLORS.ink,2);
    ctx.shadowColor='transparent';ctx.fillStyle=state.difficulty==='hard'?COLORS.redDark:COLORS.red;ctx.fillRect(-w/2+14,-h/2+10,6,h-20);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=COLORS.ink;ctx.font='900 21px serif';ctx.fillText(title,0,-4);
    ctx.font='800 10px sans-serif';ctx.fillStyle=COLORS.ink2;ctx.fillText(sub,0,13);ctx.restore();
  }

  function drawBossCurtain() {
    if (state.phase !== 'bossIntro') return;
    const t=clamp(state.phaseTimer/Math.max(.01,state.phaseDuration),0,1);
    const open=state.profile.settings.reducedMotion?t:Math.pow(t,.72);
    const sideW=state.viewW*.5*(1-open);
    ctx.save();ctx.fillStyle=state.difficulty==='hard'?COLORS.redDark:COLORS.ink;
    ctx.globalAlpha=.88*(1-t*.65);ctx.fillRect(0,0,sideW,state.viewH);ctx.fillRect(state.viewW-sideW,0,sideW,state.viewH);
    ctx.strokeStyle=COLORS.ochre;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sideW,0);ctx.lineTo(sideW,state.viewH);ctx.moveTo(state.viewW-sideW,0);ctx.lineTo(state.viewW-sideW,state.viewH);ctx.stroke();ctx.restore();
  }

  function drawVignette() {
    if (state.quality.level==='low') return;
    const g=ctx.createRadialGradient(state.viewW*.5,state.viewH*.55,state.viewW*.15,state.viewW*.5,state.viewH*.55,state.viewW*.72);
    g.addColorStop(.55,'rgba(20,14,10,0)');g.addColorStop(1,state.act===3?'rgba(12,17,28,.25)':'rgba(45,28,14,.18)');
    ctx.fillStyle=g;ctx.fillRect(0,0,state.viewW,state.viewH);
  }

  function chooseQuality() {
    const q = state.profile.settings.quality;
    if (q === 'high' || q === 'low') return q;
    const memory = navigator.deviceMemory || 8;
    const cores = navigator.hardwareConcurrency || 8;
    return memory <= 4 || cores <= 4 ? 'low' : 'high';
  }

  function fixedUpdate(dt) {
    if (!['playing', 'boss', 'transition'].includes(state.mode)) return;
    if (state.hitStop > 0) {
      state.hitStop = Math.max(0, state.hitStop - dt);
      updateParticles(dt * .18);
      return;
    }
    updateActive(dt);
  }

  function loop(now) {
    if (!state.lastTime) state.lastTime = now;
    const rawDt = Math.min(.22, Math.max(0, (now - state.lastTime) / 1000));
    state.lastTime = now;
    state.renderTime = now / 1000;
    if (['playing', 'boss', 'transition'].includes(state.mode)) {
      state.accumulator += rawDt;
      let steps = 0;
      while (state.accumulator >= FIXED_DT && steps < 6) {
        fixedUpdate(FIXED_DT);
        state.accumulator -= FIXED_DT;
        steps++;
      }
      if (steps >= 6) state.accumulator = 0;
    } else state.accumulator = 0;
    render();
    requestAnimationFrame(loop);
  }

  function populateSettings() {
    UI.soundToggle.checked = !!state.profile.settings.sound;
    UI.hapticToggle.checked = !!state.profile.settings.haptic;
    UI.motionToggle.checked = !!state.profile.settings.reducedMotion;
    UI.qualitySelect.value = state.profile.settings.quality;
    UI.skinSelect.innerHTML = '';
    for (const skin of SKINS) {
      const unlocked = state.profile.unlocks.skins.includes(skin.id);
      const option = document.createElement('option');
      option.value = skin.id;
      option.disabled = !unlocked;
      option.textContent = unlocked ? skin.name : skin.hardOnly ? `${skin.name}（烈祭踏破）` : `${skin.name}（印 ${skin.cost}）`;
      UI.skinSelect.appendChild(option);
    }
    UI.skinSelect.value = state.profile.settings.skin;
  }

  function renderRecords() {
    const normal = state.profile.records.normal;

    UI.recordSummary.classList.add('record-ledger');
    const timeText = rec => rec.bestTime > 0 ? `${Math.floor(rec.bestTime / 60)}:${String(Math.floor(rec.bestTime % 60)).padStart(2, '0')}` : '—';
    UI.recordSummary.innerHTML = `

      <div class="record-summary mode-records">
        <div class="record-cell"><b>${pretty(normal.best)}</b><span>最高点</span></div>
        <div class="record-cell"><b>${normal.clears}</b><span>踏破</span></div>
        <div class="record-cell"><b>${timeText(normal)}</b><span>最速</span></div>
      </div>
      <div class="record-mode-heading is-hard">烈祭</div>
      <div class="record-summary mode-records">
        <div class="record-cell"><b>${state.profile.unlocks.hard ? pretty(hard.best) : '—'}</b><span>最高点</span></div>
        <div class="record-cell"><b>${state.profile.unlocks.hard ? hard.clears : '—'}</b><span>踏破</span></div>

      button.style.background = `linear-gradient(135deg, ${skin.paper} 0 55%, ${skin.deep} 55% 72%, ${skin.accent} 72%)`;
      const condition = skin.hardOnly ? '烈祭踏破で解放' : `印${skin.cost}で解放`;

  function openPanel(name, returnMode) {

  function pointerToNx(ev) {
    const rect = canvas.getBoundingClientRect();
    return xToNx(ev.clientX - rect.left);
  }

  canvas.addEventListener('pointerdown', ev => {
    if (!['playing', 'boss', 'transition'].includes(state.mode) || !state.player) return;
    ev.preventDefault();
    input.pointerId = ev.pointerId;
    input.pointerType = ev.pointerType;
    input.active = true;
    input.targetNx = pointerToNx(ev);
    state.player.targetNx = input.targetNx;
    try { canvas.setPointerCapture(ev.pointerId); } catch { /* ignored */ }
  });

  canvas.addEventListener('pointermove', ev => {
    if (!input.active || ev.pointerId !== input.pointerId) return;
    ev.preventDefault();
    input.targetNx = pointerToNx(ev);
  });

  const releasePointer = ev => {
    if (ev && input.pointerId !== null && ev.pointerId !== input.pointerId) return;
    if (input.pointerId !== null) {
      try { canvas.releasePointerCapture(input.pointerId); } catch { /* ignored */ }
    }
    input.pointerId = null;
    input.active = false;
  };
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('lostpointercapture', releasePointer);
  canvas.addEventListener('contextmenu', ev => ev.preventDefault());

  window.addEventListener('keydown', ev => {
    const key = ev.key.toLowerCase();
    const editable = ev.target instanceof HTMLInputElement || ev.target instanceof HTMLSelectElement || ev.target instanceof HTMLButtonElement;
    const gameplayInput = ['playing', 'boss', 'transition'].includes(state.mode) && !editable;
    if (gameplayInput && (key === 'arrowleft' || key === 'a')) { input.left = true; ev.preventDefault(); }
    if (gameplayInput && (key === 'arrowright' || key === 'd')) { input.right = true; ev.preventDefault(); }
    if ((key === 'p' || key === 'escape') && !ev.repeat) {
      if (state.mode === 'settings') closePanel('settings');
      else if (state.mode === 'records') closePanel('records');
      else if (state.mode === 'paused' || ['playing', 'boss', 'transition'].includes(state.mode)) togglePause();
      ev.preventDefault();
    }
    if ((key === ' ' || key === 'enter') && !ev.repeat && !editable) {
      if (['playing', 'boss', 'transition'].includes(state.mode)) activateStamp(true);
      else if (state.mode === 'title') startRun(null, 'normal');
      else if (state.mode === 'result') startRun(null, state.difficulty);
      ev.preventDefault();
    }
  });

    const key = ev.key.toLowerCase();
    const wasMovement = key === 'arrowleft' || key === 'a' || key === 'arrowright' || key === 'd';
    if (key === 'arrowleft' || key === 'a') input.left = false;
    if (key === 'arrowright' || key === 'd') input.right = false;

  }

  state.quality.level = chooseQuality();
  unlockSkins();
  applySkin(state.profile.settings.skin);
  resize();
  populateSettings();
  renderRecords();
  refreshModeButtons();
  showOverlay('title');
  updateControls();
  requestAnimationFrame(loop);
})();
