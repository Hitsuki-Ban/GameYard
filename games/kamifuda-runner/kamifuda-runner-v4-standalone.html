<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9dfc8" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2710%27 fill=%27%23eadfc7%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2723%27 fill=%27%23b33a2f%27/%3E%3Cpath d=%27M22 18h20v5H35v7h7v5h-7v11h-6V35h-7v-5h7v-7h-7z%27 fill=%27%23fff8e8%27/%3E%3C/svg%3E" />
  <title>紙札疾走録・百鬼祭陣</title>
  <style>
:root {
  --paper: #e9dfc8;
  --paper-hi: #f8f0dc;
  --paper-deep: #d4bd8e;
  --ink: #211b17;
  --ink-soft: #625447;
  --red: #b33a2f;
  --red-dark: #77271f;
  --indigo: #294d68;
  --ochre: #c18a2f;
  --green: #526a51;
  --shadow: rgba(29, 21, 15, .28);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  color: var(--ink);
  background: #cbb888;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { background: #cbb888; }
button, select, input { font: inherit; }
button { color: inherit; }

#app { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
#gameCanvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; user-select: none; -webkit-user-select: none;
  background: var(--paper);
}

.hud-controls { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.round-control, .stamp-control {
  position: absolute; pointer-events: auto; border: 0; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.pause-control {
  top: calc(var(--safe-top) + 12px); right: calc(var(--safe-right) + 12px);
  width: 38px; height: 38px; border-radius: 50%;
  background: color-mix(in srgb, var(--paper-hi) 88%, transparent);
  box-shadow: 0 3px 0 rgba(33,27,23,.22), 0 0 0 2px rgba(33,27,23,.12);
  font-weight: 900; font-size: 15px;
}
.stamp-control {
  right: calc(var(--safe-right) + 14px); bottom: calc(var(--safe-bottom) + 15px);
  width: clamp(62px, 15vw, 82px); aspect-ratio: 1; border-radius: 50%;
  background: transparent; opacity: .42; transform: scale(.9);
  transition: opacity .16s ease, transform .16s ease; visibility: hidden;
}
.stamp-control.is-visible { visibility: visible; }
.stamp-control.is-ready { opacity: 1; transform: scale(1); animation: ready-pulse .9s ease-in-out infinite alternate; }
.stamp-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--ochre) var(--meter, 0deg), var(--ink) 0); box-shadow: 0 5px 0 rgba(0,0,0,.25); }
.stamp-ring::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: var(--red); border: 3px solid var(--paper-hi); }
.stamp-face { position: absolute; inset: 19%; display: grid; place-items: center; border-radius: 50%; background: var(--paper-hi); color: var(--red-dark); font-family: serif; font-weight: 900; font-size: clamp(22px, 6vw, 34px); }
@keyframes ready-pulse { to { transform: scale(1.08) rotate(-2deg); filter: drop-shadow(0 0 10px rgba(179,58,47,.35)); } }

.overlay {
  position: absolute; inset: 0; z-index: 20; display: none; place-items: center;
  padding: calc(var(--safe-top) + 18px) calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 18px);
  pointer-events: none; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: rgba(40, 31, 21, .28); backdrop-filter: blur(3px);
}
.overlay.is-active { display: grid; pointer-events: auto; }
#titleOverlay { background: transparent; backdrop-filter: none; }

.title-stage {
  position: relative; width: min(520px, 94vw); min-height: min(690px, calc(100dvh - 36px));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: clamp(26px, 6vh, 54px) clamp(24px, 7vw, 60px);
  text-align: center;
}
.title-stage::before, .title-stage::after {
  content: ""; position: absolute; z-index: -1; width: 72%; height: 84%;
  background: color-mix(in srgb, var(--paper-hi) 90%, transparent);
  border: 2px solid rgba(33,27,23,.2); box-shadow: 12px 16px 0 rgba(33,27,23,.09);
  clip-path: polygon(3% 0, 96% 2%, 100% 96%, 6% 100%, 0 8%);
}
.title-stage::after { transform: rotate(3deg); background: rgba(179,58,47,.12); box-shadow: none; }
.title-kamon { width: 88px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--ink); box-shadow: 0 7px 0 rgba(33,27,23,.25); margin-bottom: 13px; }
.title-kamon::before { content: ""; position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--paper-hi); }
.title-kamon span { position: relative; color: var(--paper-hi); font-family: serif; font-weight: 900; font-size: 43px; }
.eyebrow { margin: 0 0 7px; color: var(--red-dark); font-size: 12px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; line-height: .96; letter-spacing: .04em; }
h1 > span { display: block; font-size: clamp(42px, 12vw, 66px); }
h1 small { display: block; margin-top: 13px; color: var(--red-dark); font-size: clamp(20px, 6vw, 31px); letter-spacing: .22em; }
.title-lead { max-width: 340px; margin: 23px 0 20px; color: var(--ink-soft); font-weight: 700; line-height: 1.7; }

.start-button, .primary-button, .paper-button, .text-button, .close-button, .charm-card { cursor: pointer; }
.start-button {
  min-width: 190px; min-height: 60px; border: 0; border-radius: 4px;
  background: var(--red); color: var(--paper-hi); font-weight: 900; font-size: 20px;
  box-shadow: 0 6px 0 var(--red-dark), 0 10px 18px rgba(33,27,23,.17);
  clip-path: polygon(3% 2%, 97% 0, 100% 92%, 93% 100%, 2% 96%, 0 11%);
}
.start-button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark); }
.start-icon { margin-right: 10px; font-size: 14px; }
.title-actions { display: flex; gap: 10px; margin-top: 18px; }
.paper-button, .primary-button {
  min-height: 42px; padding: 9px 20px; border: 2px solid rgba(33,27,23,.25); border-radius: 3px;
  background: var(--paper-hi); font-weight: 800; box-shadow: 0 3px 0 rgba(33,27,23,.17);
}
.primary-button { background: var(--red); color: var(--paper-hi); border-color: var(--red-dark); min-width: 150px; }
.text-button { border: 0; background: transparent; padding: 10px; color: var(--ink-soft); font-weight: 800; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.control-hint { margin-top: 22px; display: grid; gap: 7px; color: var(--ink-soft); font-size: 12px; font-weight: 800; }
.hint-track { position: relative; width: 122px; height: 20px; margin: auto; border-bottom: 2px solid rgba(33,27,23,.28); }
.hint-track i { position: absolute; left: 50%; bottom: -7px; width: 22px; height: 22px; border-radius: 50% 50% 42% 42%; background: var(--red); animation: hint-slide 2.1s ease-in-out infinite; }
@keyframes hint-slide { 0%,100% { transform: translateX(-49px); } 50% { transform: translateX(27px); } }

.paper-card {
  width: min(470px, 94vw); max-height: min(720px, calc(100dvh - var(--safe-top) - var(--safe-bottom) - 28px));
  overflow: auto; touch-action: pan-y; padding: clamp(24px, 6vw, 42px);
  background: var(--paper-hi); border: 2px solid rgba(33,27,23,.2);
  box-shadow: 10px 14px 0 rgba(33,27,23,.18);
  clip-path: polygon(1% 2%, 97% 0, 100% 96%, 94% 100%, 3% 98%, 0 8%);
  text-align: center;
}
.compact-card { width: min(360px, 92vw); display: grid; justify-items: center; gap: 12px; }
.card-seal { width: 72px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--indigo); color: var(--paper-hi); font: 900 34px/1 serif; }
.paper-card h2, .choice-heading h2 { margin: 2px 0 12px; font-family: serif; font-size: clamp(26px, 8vw, 38px); }

.choice-shell { width: min(980px, 96vw); max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 24px); overflow: auto; touch-action: pan-y; padding: 18px; }
.choice-heading { display: flex; justify-content: center; align-items: center; gap: 18px; margin-bottom: 14px; color: var(--paper-hi); text-align: center; text-shadow: 0 2px 0 rgba(33,27,23,.5); }
.choice-heading .eyebrow { color: #f1d09a; }
.choice-knot { width: 54px; height: 16px; border-top: 4px solid #f1d09a; border-bottom: 2px solid #f1d09a; transform: rotate(-8deg); }
.choice-knot.mirror { transform: rotate(8deg); }
.choice-list { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(10px, 2.5vw, 22px); }
.charm-card {
  position: relative; min-height: 285px; border: 0; padding: 18px 16px 17px;
  background: var(--paper-hi); color: var(--ink); box-shadow: 8px 10px 0 rgba(33,27,23,.28);
  clip-path: polygon(3% 0, 97% 2%, 100% 95%, 91% 100%, 2% 97%, 0 8%);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
}
.charm-card::after { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(33,27,23,.15); pointer-events: none; clip-path: inherit; }
.charm-card:hover { transform: translateY(-3px) rotate(-.25deg); box-shadow: 10px 14px 0 rgba(33,27,23,.25); }
.charm-visual { display: grid; grid-template-columns: 68px 116px; gap: 10px; align-items: center; justify-content: center; width: 100%; }
.charm-icon { width: 68px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper-hi); font: 900 34px/1 serif; box-shadow: inset 0 0 0 4px var(--paper-hi), inset 0 0 0 7px var(--red); }
.charm-demo { position: relative; display: block; width: 116px; height: 62px; overflow: hidden; border: 2px solid rgba(33,27,23,.22); border-radius: 10px; background: linear-gradient(180deg, rgba(193,138,47,.09), rgba(41,77,104,.07)); }
.charm-demo i, .charm-demo b, .charm-demo em { position: absolute; display: block; box-sizing: border-box; }
.charm-demo i { width: 10px; height: 10px; bottom: 10px; border-radius: 50%; background: var(--indigo); box-shadow: 0 9px 0 -3px var(--ink); }
.charm-demo i:nth-child(1) { left: 24px; }
.charm-demo i:nth-child(2) { left: 45px; }
.charm-demo i:nth-child(3) { left: 66px; }
.charm-demo b { left: 14px; top: 9px; width: 88px; height: 39px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; }
.charm-demo em { right: 11px; top: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: var(--paper-hi); }
.demo-knot b { border-color: var(--ochre-dark, #79531c); }
.demo-knot em { box-shadow: -25px 0 0 var(--ochre), -50px 0 0 var(--ochre); animation: demo-pulse 1.1s ease-in-out infinite alternate; }
.demo-bell b { left: 34px; top: 5px; width: 48px; height: 48px; border: 4px solid var(--green); border-radius: 50%; background: rgba(82,106,81,.12); }
.demo-bell em { right: 46px; top: 4px; width: 19px; height: 16px; border-radius: 10px 10px 4px 4px; background: var(--ochre); }
.demo-fox b { left: 10px; top: 29px; width: 94px; height: 3px; border: 0; background: var(--ink); }
.demo-fox em { right: 13px; top: 19px; width: 12px; height: 12px; background: var(--red); animation: demo-dodge 1.35s ease-in-out infinite; }
.demo-rice i:nth-child(3) { left: 87px; background: var(--red); animation: demo-arrive 1.2s ease-out infinite; }
.demo-rice b { left: 80px; top: 13px; width: 22px; height: 22px; border: 0; border-radius: 50% 50% 45% 45%; background: var(--ochre); }
.demo-ink b { left: 12px; top: 7px; width: 56px; height: 45px; border-color: var(--violet, #74536f); }
.demo-ink em { right: 16px; top: 32px; width: 17px; height: 23px; border-radius: 50% 50% 55% 55%; background: var(--ink); animation: demo-drop 1s ease-in infinite; }
.demo-crane b { left: 41px; top: 13px; width: 34px; height: 24px; border: 0; transform: rotate(45deg); background: var(--paper-hi); box-shadow: 0 0 0 2px var(--ink); animation: demo-rise 1.35s ease-in-out infinite; }
.demo-crane em { right: 47px; top: 38px; width: 20px; height: 4px; border-radius: 0; background: var(--red); }
.demo-echo b { left: 10px; top: 8px; width: 5px; height: 44px; border: 0; background: var(--red); box-shadow: 20px 0 0 var(--red), 40px 0 0 var(--ochre), 60px 0 0 var(--ochre), 80px 0 0 var(--ochre); animation: demo-echo .8s ease-in-out infinite alternate; }
.demo-banner b { left: 71px; top: 7px; width: 4px; height: 47px; border: 0; background: var(--ink); }
.demo-banner em { right: 16px; top: 7px; width: 29px; height: 24px; border-radius: 2px; background: var(--red); clip-path: polygon(0 0,100% 14%,82% 100%,0 78%); animation: demo-wave 1s ease-in-out infinite alternate; }
.charm-card h3 { margin: 12px 0 5px; font-family: serif; font-size: 24px; }
.charm-card p { min-height: 44px; margin: 0; color: var(--ink-soft); font-weight: 700; line-height: 1.45; }
@keyframes demo-pulse { to { transform: scale(1.16); } }
@keyframes demo-dodge { 0%,100% { transform: translateX(-68px); } 50% { transform: translateX(0) translateY(-12px); } }
@keyframes demo-arrive { 0% { opacity: 0; transform: translateX(16px); } 70%,100% { opacity: 1; transform: none; } }
@keyframes demo-drop { 0% { transform: translateY(-18px) scale(.55); opacity: .2; } 100% { transform: translateY(10px); opacity: 1; } }
@keyframes demo-rise { 0%,100% { transform: translateY(12px) rotate(45deg) scale(.72); opacity: .45; } 55% { transform: translateY(-4px) rotate(45deg); opacity: 1; } }
@keyframes demo-echo { to { transform: translateX(10px); } }
@keyframes demo-wave { to { transform: skewY(-8deg) translateY(2px); } }

.result-card { width: min(520px, 94vw); }
.result-seal { width: 78px; aspect-ratio: 1; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 50%; background: var(--red); color: var(--paper-hi); font: 900 38px/1 serif; }
.result-grade { width: 84px; height: 84px; margin: 9px auto 16px; display: grid; place-items: center; border: 5px double var(--ink); border-radius: 50%; color: var(--red-dark); font: 900 42px/1 serif; transform: rotate(-5deg); }
.result-stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.result-stat { padding: 10px; background: rgba(193,138,47,.12); border-bottom: 2px solid rgba(33,27,23,.18); }
.result-stat b { display: block; font-size: 22px; }
.result-stat span { color: var(--ink-soft); font-size: 12px; font-weight: 800; }
.result-cause { min-height: 34px; margin: 9px 0 16px; color: var(--ink-soft); font-weight: 800; }

.panel-heading { display: flex; align-items: flex-start; justify-content: space-between; text-align: left; margin-bottom: 12px; }
.panel-heading h2 { margin: 0; }
.close-button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(33,27,23,.09); font-size: 26px; font-weight: 500; }
.settings-card, .records-card { text-align: left; }
.setting-row { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 54px; border-bottom: 1px solid rgba(33,27,23,.15); font-weight: 800; }
.setting-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 50px; height: 28px; border-radius: 20px; background: rgba(33,27,23,.22); padding: 4px; transition: background .15s; }
.switch::after { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--paper-hi); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
.setting-row input:checked + .switch { background: var(--indigo); }
.setting-row input:checked + .switch::after { transform: translateX(22px); }
.select-row select { min-width: 120px; padding: 7px 9px; border: 1px solid rgba(33,27,23,.25); background: var(--paper-hi); }
.wide-button { width: 100%; margin-top: 17px; }
.danger-text { display: block; margin: 10px auto 0; color: var(--red-dark); }
.record-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 22px; }
.record-cell { padding: 12px 5px; text-align: center; background: rgba(41,77,104,.09); }
.record-cell b { display: block; font-size: 22px; }
.record-cell span { font-size: 11px; color: var(--ink-soft); font-weight: 800; }
.skin-gallery { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.skin-swatch { min-height: 86px; border: 3px solid transparent; background: var(--paper); cursor: pointer; position: relative; }
.skin-swatch.is-selected { border-color: var(--red); }
.skin-swatch.is-locked::after { content: "封"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(33,27,23,.66); color: var(--paper-hi); font: 900 24px serif; }
.records-note { color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
.toast { position: absolute; z-index: 50; left: 50%; bottom: calc(var(--safe-bottom) + 22px); transform: translate(-50%, 20px); padding: 9px 16px; border-radius: 3px; background: var(--ink); color: var(--paper-hi); font-weight: 800; opacity: 0; pointer-events: none; transition: .2s; }
.toast.is-active { opacity: 1; transform: translate(-50%, 0); }

button:focus-visible, select:focus-visible, label:focus-within { outline: 4px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px var(--indigo); }
button[disabled] { opacity: .45; cursor: default; }

@media (max-width: 680px) {
  .choice-list { grid-template-columns: 1fr; }
  .choice-shell { width: min(480px, calc(100vw - var(--safe-left) - var(--safe-right) - 36px)); padding-inline: 8px; }
  .charm-card { min-height: 142px; display: grid; grid-template-columns: 168px 1fr; grid-template-rows: auto auto; column-gap: 10px; text-align: left; padding: 12px; }
  .charm-visual { grid-column: 1; grid-row: 1 / 3; grid-template-columns: 54px 106px; gap: 6px; }
  .charm-icon { width: 54px; font-size: 28px; }
  .charm-demo { width: 106px; height: 58px; }
  .charm-card h3 { grid-column: 2; margin: 0 0 3px; font-size: 20px; align-self: end; }
  .charm-card p { grid-column: 2; min-height: 0; font-size: 12px; align-self: start; }
  .title-stage { min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 36px); }
}

@media (max-height: 560px) and (orientation: landscape) {
  .title-stage { width: min(780px, 95vw); min-height: calc(100dvh - 20px); display: grid; grid-template-columns: 130px 1fr 190px; grid-template-rows: auto auto auto; column-gap: 22px; padding: 18px 34px; }
  .title-kamon { grid-row: 1 / 4; margin: 0; }
  .title-stage .eyebrow, .title-stage h1, .title-lead { grid-column: 2; }
  .title-stage .eyebrow { align-self: end; }
  .title-lead { margin: 8px 0; line-height: 1.4; }
  .start-button, .title-actions, .control-hint { grid-column: 3; }
  .start-button { grid-row: 1; align-self: end; }
  .title-actions { grid-row: 2; margin: 8px 0 0; }
  .control-hint { grid-row: 3; margin-top: 5px; }
  h1 > span { font-size: 42px; } h1 small { font-size: 20px; margin-top: 7px; }
  .choice-list { grid-template-columns: repeat(3,1fr); }
  .charm-card { min-height: 220px; display: flex; text-align: center; }
  .charm-icon { width: 72px; }
  .paper-card { max-height: calc(100dvh - 18px); padding: 20px 28px; }
  .result-card { width: min(720px, 94vw); display: grid; grid-template-columns: 110px 1fr 160px; column-gap: 18px; align-items: center; }
  .result-seal, .result-grade { grid-column: 1; }
  .result-card .eyebrow, .result-card h2, .result-stats, .result-cause { grid-column: 2; }
  .result-card .primary-button, .result-card .paper-button { grid-column: 3; }
}


@media (max-width: 480px) and (max-height: 640px) and (orientation: portrait) {
  .result-card { padding: 15px 18px 14px; }
  .result-seal { width: 58px; margin-bottom: 3px; font-size: 29px; }
  .result-card h2 { margin-bottom: 4px; font-size: 27px; }
  .result-grade { width: 62px; height: 62px; margin: 2px auto 8px; border-width: 4px; font-size: 31px; }
  .result-stats { gap: 4px; margin-bottom: 5px; }
  .result-stat { padding: 6px 5px; }
  .result-stat b { font-size: 18px; }
  .result-stat span { font-size: 10px; }
  .result-cause { min-height: 22px; margin: 4px 0 8px; font-size: 12px; }
  .result-card .primary-button, .result-card .paper-button { min-height: 40px; margin-top: 5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .001ms !important; }
}

/* Short landscape result layout: explicit rows prevent action buttons from
   falling below the viewport on 390px-high phones. */
@media (max-height: 560px) and (orientation: landscape) {
  .result-card {
    width: min(760px, 96vw);
    max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 16px);
    padding: 14px 22px;
    grid-template-columns: 88px minmax(280px, 1fr) 154px;
    grid-template-rows: 24px 46px 72px 32px;
    column-gap: 16px;
    row-gap: 4px;
    align-items: center;
  }

  function cloneDefaultProfile() {
    return JSON.parse(JSON.stringify(PROFILE_DEFAULT));
  }

  function mergeModeRecord(target, source) {
    if (!source || typeof source !== 'object') return;
    for (const key of ['best', 'clears', 'runs', 'bestAct', 'bestTime']) {
      if (Number.isFinite(Number(source[key]))) target[key] = Number(source[key]);
    }
    if (typeof source.bestGrade === 'string') target.bestGrade = source.bestGrade;
  }

  function loadProfile() {
    const profile = cloneDefaultProfile();
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          mergeModeRecord(profile.records.normal, parsed.records?.normal);
          mergeModeRecord(profile.records.hard, parsed.records?.hard);
          profile.records.totalSeals = Number(parsed.records?.totalSeals || 0);
          Object.assign(profile.settings, parsed.settings || {});
          if (Array.isArray(parsed.unlocks?.skins)) profile.unlocks.skins = [...new Set(['washi', ...parsed.unlocks.skins])];
          profile.unlocks.hard = !!parsed.unlocks?.hard;
          Object.assign(profile.tutorial, parsed.tutorial || {});
        }
      } else {
        const v2raw = localStorage.getItem('kamifuda.runner.profile.v2');
        const legacy = v2raw || localStorage.getItem('kamifuda.runner.profile');
        if (legacy) {
          const old = JSON.parse(legacy);
          const oldRecord = old.records || old;
          mergeModeRecord(profile.records.normal, oldRecord);
          profile.records.totalSeals = Number(oldRecord.totalSeals ?? old.stamps ?? 0);
          Object.assign(profile.settings, old.settings || {});
          if (Array.isArray(old.unlocks?.skins)) profile.unlocks.skins = [...new Set(['washi', ...old.unlocks.skins])];
          profile.unlocks.hard = Number(oldRecord.clears || 0) > 0;
        }
      }
    } catch { /* Local storage can be unavailable in embedded browsers. */ }
    if (profile.records.normal.clears > 0) profile.unlocks.hard = true;
    return profile;
  }

  function shadeHex(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp(((n >> 16) & 255) * (1 + factor), 0, 255) | 0;
    const g = clamp(((n >> 8) & 255) * (1 + factor), 0, 255) | 0;
    const b = clamp((n & 255) * (1 + factor), 0, 255) | 0;
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
  }

  function safeInsets() {
    const css = getComputedStyle(safeProbe);

  function buildLayout() {
    const w = state.viewW, h = state.viewH;
    const safe = safeInsets();
    const portrait = h > w;
    const short = h < 520;
    const usableW = Math.max(280, w - safe.left - safe.right);
    const trackWidth = Math.min(800, Math.max(Math.min(300, usableW), usableW * (portrait ? .92 : .60)));
    const left = safe.left + (usableW - trackWidth) * .5;
    const hudH = safe.top + (w < 620 ? 78 : 64);
    const top = hudH + 10;
    const playerY = h - safe.bottom - h * (short ? .22 : portrait ? .20 : .21);
    return {
      w, h, portrait, short, safe,
      track: { left, right: left + trackWidth, width: trackWidth, center: left + trackWidth * .5, top, bottom: h + 120 },
      playerY,
      hudH,
      gateW: clamp(trackWidth * .28, 86, 178),
      gateH: clamp(h * .135, 76, 108),
      unit: Math.min(w, h) / 700,
    };
  }

  function nxToX(nx) {
    const tr = state.layout.track;
    return tr.left + tr.width * clamp(nx, 0, 1);
  }

  function xToNx(x) {
    const tr = state.layout.track;
    return clamp((x - tr.left) / tr.width, 0, 1);
  }

  function resize() {
    const oldH = state.viewH || 1;
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(state.profile.settings.quality === 'low' ? 1.25 : 2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.viewW = rect.width;
    state.viewH = rect.height;
    state.dpr = dpr;
    state.layout = buildLayout();
    const sy = oldH > 1 ? rect.height / oldH : 1;
    if (Math.abs(sy - 1) > .001) {
      for (const list of [state.enemies, state.bullets, state.enemyShots, state.hazards, state.particles, state.texts]) {
        for (const item of list) if (Number.isFinite(item.y)) item.y *= sy;
      }
    }
    if (state.player) {
      state.player.x = nxToX(state.player.nx);
      state.player.targetX = nxToX(state.player.targetNx);
      state.player.y = state.layout.playerY;
    }
    for (const e of state.enemies) e.x = nxToX(e.nx);
    for (const g of state.gates) g.x = nxToX(g.nx);
    for (const h of state.hazards) {
      if (typeof h.nx === 'number') h.x = nxToX(h.nx);

    for (const s of state.enemyShots) if (typeof s.nx === 'number') s.x = nxToX(s.nx);

  function initAudio() {
    if (audio.ctx || !state.profile.settings.sound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain();
    master.gain.value = .34;
    master.connect(ac.destination);
    const noise = ac.createBuffer(1, Math.floor(ac.sampleRate * .35), ac.sampleRate);
    const data = noise.getChannelData(0);
    let v = 0;
    const noiseRng = new RNG(0x7347ac21);
    for (let i = 0; i < data.length; i++) {
      v = v * .86 + (noiseRng.next() * 2 - 1) * .14;
      data[i] = v * (1 - i / data.length);
    }
    Object.assign(audio, { ctx: ac, master, noise });
  }

  function setSoundEnabled(enabled) {
    state.profile.settings.sound = !!enabled;

    saveProfile();

  function sfx(name, volume = 1, pitch = 1) {
    if (!state.profile.settings.sound) return;
    initAudio();
    if (!audio.ctx || audio.voices >= audio.maxVoices) return;
    const nowPerf = performance.now();
    const minGap = name === 'kill' ? 38 : name === 'shot' ? 70 : 12;
    if ((audio.last.get(name) || 0) + minGap > nowPerf) return;
    audio.last.set(name, nowPerf);
    const ac = audio.ctx;
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    const now = ac.currentTime;
    audio.voices++;

    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    gain.gain.value = .0001;
    filter.type = 'lowpass';
    filter.frequency.value = 2200;
    gain.connect(filter);
    filter.connect(audio.master);

    const finish = () => { audio.voices = Math.max(0, audio.voices - 1); };
    const env = (peak, attack, decay) => {
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(.0002, peak * volume), now + attack);
      gain.gain.exponentialRampToValueAtTime(.0001, now + decay);
    };

    if (['boom', 'hurt', 'stamp', 'drum'].includes(name)) {
      const src = ac.createBufferSource();
      src.buffer = audio.noise;
      const base = name === 'hurt' ? 620 : name === 'stamp' ? 260 : 340;
      filter.frequency.setValueAtTime(base * pitch, now);
      filter.frequency.exponentialRampToValueAtTime(90, now + .22);
      env(name === 'stamp' ? .44 : .28, .008, name === 'stamp' ? .34 : .23);
      src.connect(gain);
      src.onended = finish;
      src.start(now);
      src.stop(now + .35);
      return;
    }

    const osc = ac.createOscillator();
    const bases = { gate: 660, tier: 820, kill: 410, shot: 190, choice: 560, shield: 350, near: 1020, ready: 760, fail: 170, click: 520, boss: 95 };
    osc.type = name === 'tier' || name === 'near' ? 'square' : name === 'boss' ? 'sawtooth' : 'triangle';
    const base = (bases[name] || 440) * pitch;
    osc.frequency.setValueAtTime(base, now);
    if (name === 'gate' || name === 'choice' || name === 'tier') osc.frequency.exponentialRampToValueAtTime(base * 1.55, now + .15);
    else osc.frequency.exponentialRampToValueAtTime(Math.max(50, base * .58), now + .12);
    env(name === 'ready' ? .14 : name === 'boss' ? .12 : .09, .008, name === 'boss' ? .3 : .16);
    osc.connect(gain);
    osc.onended = finish;
    osc.start(now);
    osc.stop(now + (name === 'boss' ? .32 : .18));
  }

    };
  }
  function makeActEncounters(act) {
    const source = ACT_DATA[act]?.encounters?.[state.difficulty] || ACT_DATA[act]?.encounters?.normal || [];
    return source.map(cloneEncounter);
  }
  function bossPrepEncounter() {
    const source = actData().bossPrep?.[state.difficulty] || actData().bossPrep?.normal;
    return {
      id: `boss_prep_${state.act}_${state.difficulty}`, kind: 'bossPrep', bossPrep: true,
      name: source?.name || '大鬼支度', stage: '支度', strength: 1,
      gates: (source?.gates || ['power', 'shield']).slice(),
      preview: (source?.preview || []).map(item => ({ ...item })), variant: 0,
    };
  }
  function gateOptionFromSpec(spec) {
    if (typeof spec === 'object' && spec?.kind) return spec.kind === 'form' ? formOption(spec.form) : statOption(spec.kind);
    if (typeof spec !== 'string') return statOption('count');
    if (spec.startsWith('form:')) return formOption(spec.slice(5));
    return statOption(spec);
  }
  function setPhase(name, duration = 0) {
    state.phase = name;
    state.phaseTimer = 0;
    state.phaseDuration = duration;
  }

  function resetStats() {
    state.stats = {
      kills: 0, hits: 0, nearMisses: 0, perfectGates: 0, missedGates: 0,
      wavesNoHit: 0, stampUses: 0, manualStamps: 0, autoStamps: 0,
      bossTimes: [], gateHistory: [], damageLost: 0, deathCause: null,
      actReached: 1, waves: 0, tier3Gates: 0, focusSwitches: 0,
      priorityKills: 0, bannerRestores: 0, beatsSeen: 0, bossPatterns: [],
      bossPrepGates: 0, gateChargeWaste: 0,
    };
  }

  function createPlayer() {
    const rules = modeRules();
    return {
      nx: .5, targetNx: .5, x: nxToX(.5), targetX: nxToX(.5), y: state.layout.playerY,
      count: rules.startCount, maxCount: state.difficulty === 'hard' ? 145 : 160, power: 1, tempo: 1,
      shield: rules.startShield, maxShield: rules.maxShield,
      form: 'fan', mastery: { fan: 1, spear: 0, spiral: 0, drum: 0 },
      fireTimer: .08, invuln: 0, momentum: 0, readyTime: 0,
      stampTimer: 0, echoTimer: 0,
      charms: [], craneUsed: false, moving: 0, bannerWaveRestores: 0,
    };
  }

  function clearObjects() {
    state.gates.length = 0;
    state.enemies.length = 0;
    state.bullets.length = 0;
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    state.particles.length = 0;
    state.texts.length = 0;
    state.scenery.length = 0;
    state.boss = null;
    state.focusGateId = null;
  }

  function startRun(seed = null, difficulty = 'normal') {
    initAudio();
    resetInput();
    state.generation++;
    const chosenMode = difficulty === 'hard' ? 'hard' : 'normal';
    state.difficulty = chosenMode;
    const actualSeed = Number.isFinite(Number(seed)) ? Number(seed) : randSeed();
    state.seed = actualSeed >>> 0 || 1;
    state.gameplayRng = new RNG(state.seed ^ 0x9e3779b9 ^ (chosenMode === 'hard' ? 0x5bd1e995 : 0));
    state.spawnRng = new RNG(state.seed ^ 0x85ebca6b ^ (chosenMode === 'hard' ? 0x27d4eb2f : 0));
    state.fxRng = new RNG(state.seed ^ 0xc2b2ae35);
    state.simTime = 0;
    state.runTime = 0;
    state.scroll = 0;
    state.act = 1;
    state.encounterIndex = 0;
    state.currentEncounter = null;
    state.bossPrepared = false;
    state.encounters = makeActEncounters(1);
    state.player = createPlayer();
    state.score = 0;
    state.sealsEarned = 0;
    state.combo = 0;
    state.comboTimer = 0;
    state.shake = 0;
    state.flash = 0;
    state.hitStop = 0;
    state.speedScale = chosenMode === 'hard' ? 1.08 : 1;
    state.transition = null;
    state.result = null;
    resetStats();
    clearObjects();
    currentRecord().runs++;
    saveProfile();
    document.documentElement.classList.toggle('hard-run', chosenMode === 'hard');
    state.mode = 'playing';
    showOverlay(null);
    setPhase('actIntro', chosenMode === 'hard' ? 1.34 : 1.48);
    addText(.5, state.viewH * .43, chosenMode === 'hard' ? `烈・${ACT_DATA[1].subtitle}` : ACT_DATA[1].subtitle, COLORS.redDark, 1.35, 38, 'center');
    updateControls();
  }

  function returnToTitle() {
    resetInput();
    state.generation++;
    clearObjects();
    state.player = null;
    state.mode = 'title';
    state.phase = 'idle';
    document.documentElement.classList.remove('hard-run');
    refreshModeButtons();
    showOverlay('title');
    updateControls();
  }

  function pauseGame() {
    if (!['playing', 'boss', 'transition'].includes(state.mode)) return;
    state.resumeMode = state.mode;
    state.mode = 'paused';
    showOverlay('pause');
    updateControls();
  }

  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = state.resumeMode || 'playing';
    showOverlay(null);
    state.lastTime = performance.now();
    state.accumulator = 0;
    updateControls();
  }

  function togglePause() {
    if (state.mode === 'paused') resumeGame();
    else pauseGame();
  }

  function updateControls() {
    const gameplay = ['playing', 'boss', 'transition'].includes(state.mode);
    UI.pauseButton.style.visibility = gameplay ? 'visible' : 'hidden';
    const stampVisible = gameplay && !!state.player;
    UI.stampButton.classList.toggle('is-visible', stampVisible);
    if (state.player) UI.stampButton.style.setProperty('--meter', `${state.player.momentum * 3.6}deg`);
    const ready = stampVisible && state.player.momentum >= 100;
    UI.stampButton.classList.toggle('is-ready', ready);
    UI.stampButton.disabled = !ready;
  }

  function gateThreshold(index) {
    const reduction = state.player?.charms.includes('knot') ? .90 : 1;
    const actScale = 1 + Math.max(0, state.act - 1) * .025;
    const prepScale = state.currentEncounter?.bossPrep ? .90 : 1;
    return GATE_THRESHOLDS[index] * modeRules().gateScale * actScale * prepScale * reduction;
  }

  function chargeTier(value) {
    let tier = 0;
    for (let i = 0; i < 3; i++) if (value >= gateThreshold(i)) tier = i + 1;
    return tier;
  }

  function formOption(form) {
    return { kind: 'form', form, style: GATE_STYLE.form };
  }

  function statOption(kind) {
    return { kind, style: GATE_STYLE[kind] || GATE_STYLE.count };
  }

  function gateKey(option) {
    return option.kind === 'form' ? `form:${option.form}` : option.kind;
  }

  function adaptGateOption(option) {
    const p = state.player;
    if (option.kind === 'form' && p.form === option.form && p.mastery[option.form] >= 3) {
      const replacements = { fan: 'count', spear: 'power', spiral: 'shield', drum: 'tempo' };
      return statOption(replacements[option.form]);
    }
    if (option.kind === 'power' && p.power >= 14) return statOption('count');
    if (option.kind === 'tempo' && p.tempo >= 2.8) return statOption(p.shield < p.maxShield ? 'shield' : 'power');
    if (option.kind === 'shield' && p.shield >= p.maxShield && p.count >= p.maxCount * .9) return statOption('power');
    return option;
  }

  function buildGateOptions(encounter) {
    const authored = (encounter.gates || ['count', 'power']).map(gateOptionFromSpec).map(adaptGateOption);
    let pair = authored.slice(0, 2);
    while (pair.length < 2) pair.push(statOption(pair.length ? 'shield' : 'count'));
    if (gateKey(pair[0]) === gateKey(pair[1])) pair[1] = statOption(pair[0].kind === 'shield' ? 'count' : 'shield');

    // Normal mode uses a visible recovery offer only when a run is genuinely
    // close to collapse. Hard mode preserves the authored pair without help.
    const p = state.player;
    const needsMercy = state.difficulty === 'normal' && !encounter.bossPrep && state.act > 1 && (p.count < 22 || p.shield === 0 && p.count < 34);
    if (needsMercy && !pair.some(option => option.kind === 'shield')) pair[1] = statOption('shield');

    if (state.gameplayRng.chance(.5)) pair.reverse();
    return pair;
  }

  function beginGate(encounter) {
    state.currentEncounter = encounter;
    const pair = buildGateOptions(encounter);
    const startY = state.layout.track.top + 20;
    state.gates = pair.map((option, i) => ({
      id: `${state.generation}:${state.act}:${state.encounterIndex}:${encounter.bossPrep ? 'b' : 'w'}:${i}`,
      lane: i === 0 ? 'left' : 'right', nx: i === 0 ? .28 : .72,
      x: nxToX(i === 0 ? .28 : .72), y: startY,
      option, charge: 0, tier: 0, previousTier: 0, selected: false, dead: false,
    }));
    state.focusGateId = state.player.nx < .45 ? state.gates[0].id : state.player.nx > .55 ? state.gates[1].id : null;
    state.player.fireTimer = .02;
    state.mode = 'playing';
    const base = encounter.bossPrep ? modeRules().prepGateDuration : modeRules().gateDuration;
    setPhase('gate', state.layout.short ? base * .90 : base);
    if (encounter.bossPrep) addText(.5, state.layout.hudH + 124, encounter.name || '', COLORS.redDark, .92, 25, 'center');
    sfx('gate', encounter.bossPrep ? 1 : .8, encounter.bossPrep ? .82 : 1);
    updateControls();
  }

  function beginEncounter() {
    const encounter = state.encounters[state.encounterIndex];
    if (encounter) {
      beginGate(encounter);
      return;
    }
    if (!state.bossPrepared) {
      state.bossPrepared = true;
      beginGate(bossPrepEncounter());
      return;
    }
    beginBossIntro();
  }

  function beginCombat(encounter) {
    state.gates.length = 0;
    state.focusGateId = null;
    state.currentEncounter = encounter;
    state.currentEncounter.schedule = buildWaveSchedule(encounter);
    state.currentEncounter.cursor = 0;
    state.currentEncounter.elapsed = 0;
    state.currentEncounter.damaged = false;
    state.currentEncounter.clearTimer = 0;
    state.currentEncounter.lastBeat = -1;
    state.player.bannerWaveRestores = 0;
    state.stats.waves++;
    state.mode = 'playing';
    setPhase('combat');
    addText(.5, state.layout.hudH + 94, `${encounter.stage || ''}・${encounter.name || ''}`, state.act === 3 ? COLORS.paperHi : COLORS.ink2, .85, 21, 'center');
  }

  function finishWave() {
    if (state.phase !== 'combat') return;
    if (!state.currentEncounter.damaged) {
      state.stats.wavesNoHit++;
      addMomentum(state.difficulty === 'hard' ? 9 : 12, 'perfect');
      addScore(250 + state.act * 100, .5, state.viewH * .28, '無傷');
      if (state.player.charms.includes('bell')) {
        state.player.shield = Math.min(state.player.maxShield, state.player.shield + 1);
        sfx('shield', .7);
      }
    }
    state.encounterIndex++;
    setPhase('waveClear', state.difficulty === 'hard' ? .58 : .68);
    state.mode = 'transition';
    state.enemies.length = 0;
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    updateControls();
  }

  function beginBossIntro() {
    state.mode = 'transition';
    setPhase('bossIntro', 1.5);
    state.enemies.length = 0;
    state.enemyShots.length = 0;
    state.hazards.length = 0;
    state.currentEncounter = null;
    sfx('boss', 1.1);
    haptic([40, 35, 70]);
    updateControls();
  }

  function addMomentum(amount, source = '') {
    const p = state.player;
    if (!p) return;
    let gain = amount * modeRules().momentum;
    if (p.charms.includes('fox') && ['near', 'destroy'].includes(source)) gain *= 1.35;
    const before = p.momentum;
    p.momentum = clamp(p.momentum + gain, 0, 100);
    if (before < 100 && p.momentum >= 100) {
      p.readyTime = 0;
      sfx('ready', 1);
      haptic(25);
      toast('祭印が満ちた');
    }
    updateControls();
  }

  function addScore(amount, nx = null, y = null, label = null) {
    const crowdBonus = state.player?.charms.includes('banner') ? 1 + Math.min(.75, state.player.count / 220) : 1;
    const comboBonus = 1 + Math.min(2.25, state.combo * .025);
    const value = Math.max(0, Math.round(amount * crowdBonus * comboBonus));
    state.score += value;
    if (nx !== null && y !== null && value >= 18) addText(nx, y, label || `+${value}`, COLORS.ochre, .65, 18, 'world');
  }

  function addText(nx, y, text, color = COLORS.ink, life = .8, size = 24, space = 'world') {
    const x = space === 'world' ? nxToX(nx) : space === 'center' ? state.layout.track.center : nx;
    state.texts.push({ nx, x, y, text, color, life, maxLife: life, size, space, vy: -32 });
    if (state.texts.length > 48) state.texts.splice(0, state.texts.length - 48);
  }

  function addParticle(nx, y, color, count = 8, power = 1, kind = 'paper') {
    const budget = state.quality.level === 'low' ? .45 : 1;
    const n = Math.max(1, Math.floor(count * budget * (state.profile.settings.reducedMotion ? .35 : 1)));
    for (let i = 0; i < n; i++) {
      const a = state.fxRng.range(0, TAU);
      const speed = state.fxRng.range(35, 170) * power;
      state.particles.push({
        nx, x: nxToX(nx), y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 30,
        life: state.fxRng.range(.32, .78), maxLife: .78, size: state.fxRng.range(2.5, 8) * power,
        color, angle: state.fxRng.range(0, TAU), spin: state.fxRng.range(-7, 7), kind,
      });
    }
    const cap = state.quality.level === 'low' ? 140 : 320;
    if (state.particles.length > cap) state.particles.splice(0, state.particles.length - cap);
  }

  function burstFollowers(nx, y, count) {
    const colors = [COLORS.red, COLORS.indigo, COLORS.ochre, COLORS.green];
    for (let i = 0; i < Math.min(36, count); i++) addParticle(nx + state.fxRng.range(-.07, .07), y + state.fxRng.range(-8, 8), state.fxRng.pick(colors), 1, .75, 'follower');
  }

  function gateDisplay(option, tier) {
    const r = clamp(tier, 0, 3);
    if (option.kind === 'count') return `×${COUNT_MULTIPLIER[r].toFixed(r ? 1 : 2)}`;
    if (option.kind === 'power') return `+${POWER_GAIN[r]}`;
    if (option.kind === 'tempo') return `+${Math.round(TEMPO_GAIN[r] * 100)}%`;
    if (option.kind === 'shield') return `+${SHIELD_GAIN[r]}`;
    if (option.kind === 'form') return r ? `${FORM[option.form].icon} ${'ⅠⅡⅢ'[r - 1]}` : FORM[option.form].icon;
    return '';
  }

  function gateName(option) {
    if (option.kind === 'form') return FORM[option.form].name;
    return { count: '紙衆', power: '筆勢', tempo: '拍子', shield: '結界' }[option.kind] || '';
  }

  function applyGate(gate) {
    const p = state.player;
    const option = gate.option;
    const rank = clamp(gate.tier, 0, 3);
    let overflow = 0;
    if (option.kind === 'count') {
      const before = p.count;
      const raw = Math.ceil(before * COUNT_MULTIPLIER[rank]);
      p.count = Math.min(p.maxCount, raw);
      overflow = Math.max(0, raw - p.maxCount);
      addText(p.nx, p.y - 88, gateDisplay(option, rank), option.style.color, 1.05, 34, 'world');
      burstFollowers(p.nx, p.y - 12, Math.max(8, p.count - before));
    } else if (option.kind === 'power') {
      const before = p.power;
      p.power = Math.min(14, p.power + POWER_GAIN[rank]);
      overflow = Math.max(0, before + POWER_GAIN[rank] - 14) * 5;
      addText(p.nx, p.y - 88, `筆 +${p.power - before}`, option.style.color, 1.05, 30, 'world');
    } else if (option.kind === 'tempo') {
      const before = p.tempo;
      p.tempo = Math.min(2.8, p.tempo + TEMPO_GAIN[rank]);
      overflow = Math.max(0, before + TEMPO_GAIN[rank] - 2.8) * 30;
      addText(p.nx, p.y - 88, `拍 +${Math.round((p.tempo - before) * 100)}%`, option.style.color, 1.05, 28, 'world');
    } else if (option.kind === 'shield') {
      const beforeShield = p.shield;
      p.shield = Math.min(p.maxShield, p.shield + SHIELD_GAIN[rank]);
      const beforeCount = p.count;
      p.count = Math.min(p.maxCount, p.count + RECOVER_GAIN[rank]);
      overflow = Math.max(0, beforeShield + SHIELD_GAIN[rank] - p.maxShield) * 7;
      addText(p.nx, p.y - 88, `結 +${p.shield - beforeShield}${p.count > beforeCount ? `　衆+${p.count - beforeCount}` : ''}`, option.style.color, 1.08, 27, 'world');
    } else if (option.kind === 'form') {
      const form = option.form;
      const same = p.form === form;
      const beforeCount = p.count;
      p.form = form;
      if (same) p.mastery[form] = Math.min(3, p.mastery[form] + (rank >= 3 ? 2 : 1));
      else p.mastery[form] = Math.min(3, Math.max(p.mastery[form], Math.max(1, rank)));

      // The small recruit column is printed on the gate result. It prevents a
      // formation choice from becoming a dead growth turn without hiding
      // power or tempo bonuses behind the pictogram.
      const recruits = [0, 3, 6, 10][rank];
      p.count = Math.min(p.maxCount, p.count + recruits);
      overflow = Math.max(0, beforeCount + recruits - p.maxCount);
      addText(p.nx, p.y - 88, `${FORM[form].icon} ${'ⅠⅡⅢ'[p.mastery[form] - 1] || ''}${p.count > beforeCount ? `　衆+${p.count - beforeCount}` : ''}`, FORM[form].color, 1.08, 31, 'world');
    }
    if (overflow > 0) {
      addMomentum(Math.min(24, overflow), 'overflow');
      addScore(overflow * 12, p.nx, p.y - 122, '余');
    }
    state.stats.gateHistory.push({ act: state.act, encounter: state.encounterIndex, encounterId: state.currentEncounter?.id || null, bossPrep: !!state.currentEncounter?.bossPrep, kind: option.kind, form: option.form || null, tier: rank });
    if (state.currentEncounter?.bossPrep) state.stats.bossPrepGates++;
    if (rank === 3) {
      state.stats.perfectGates++;
      state.stats.tier3Gates++;
      state.sealsEarned++;
    }
    state.flash = Math.max(state.flash, .32);
    state.shake = Math.max(state.shake, 6 + rank * 2);
    sfx('choice', .9, 1 + rank * .08);
    haptic(rank === 3 ? [24, 18, 42] : 24);
  }

  function resolveGate() {
    if (!state.gates.length) return;
    const centralMiss = Math.abs(state.player.nx - .5) < .035;
    const lane = state.player.nx < .5 ? 'left' : 'right';
    const chosen = state.gates.find(g => g.lane === lane);
    if (centralMiss || !chosen) {
      state.stats.missedGates++;
      addText(.5, state.layout.playerY - 88, '空振り', COLORS.ink2, .9, 25, 'world');
      sfx('fail', .5);
    } else {
      applyGate(chosen);
      chosen.chosen = true;
    }
    state.gates.forEach(g => { if (g !== chosen || centralMiss) g.dead = true; });
    if (!state.profile.tutorial.seen && state.difficulty === 'normal' && state.act === 1 && state.encounterIndex === 0) {
      state.profile.tutorial.seen = true;
      saveProfile();
    }
    setPhase('gateResolve', state.currentEncounter?.bossPrep ? .38 : .44);
    state.mode = 'transition';
    updateControls();
  }

  function buildWaveSchedule(encounter) {
    const s = encounter.strength || 1;
    const v = encounter.variant || 0;
    const mirror = v % 2 === 1;
    const list = [];
    const mx = nx => mirror ? 1 - nx : nx;
    const enemy = (t, kind, nx, scale = 1, extra = {}) => list.push({ type: 'enemy', t, kind, nx: clamp(mx(nx), .05, .95), scale: s * scale, ...extra });
    const row = (t, kind, count, a = .18, b = .82, gap = .08, scale = 1, extra = {}) => {
      for (let i = 0; i < count; i++) {
        const nx = count === 1 ? .5 : lerp(a, b, i / (count - 1));
        enemy(t + i * gap, kind, nx, scale, { ...extra, phase: i * .73 });
      }
    };
    const packet = (t, kind, center, count, spread = .05, gap = .06, scale = 1, extra = {}) => {
      for (let i = 0; i < count; i++) enemy(t + i * gap, kind, center + (i - (count - 1) / 2) * spread, scale, { ...extra, phase: i * .9 });
    };
    const sweep = (t, lane, width = .34, warning = .9, damage = 5) => list.push({ type: 'sweep', t, lane: typeof lane === 'number' ? mx(lane) : mirror && lane === 'left' ? 'right' : mirror && lane === 'right' ? 'left' : lane, width, warning, damage });
    const beat = (t, index) => list.push({ type: 'beat', t, index });

    switch (encounter.id) {
      case 'paper_tide':
        beat(.02, 0);
        if (!v) {
          row(.15, 'chaff', 5, .27, .73, .07, 1, { depth: .14 });
          beat(1.18, 1); packet(1.24, 'chaff', .23, 4, .045, .055, 1.02, { depth: .06 }); packet(1.24, 'chaff', .77, 4, .045, .055, 1.02, { depth: .06 });
          beat(2.48, 2); row(2.56, 'chaff', 9, .12, .88, .055, 1.06);
        } else {
          packet(.15, 'chaff', .5, 6, .035, .065, 1, { depth: .12 });
          beat(1.15, 1); row(1.22, 'chaff', 7, .13, .87, .075, 1.03, { depth: .05 });
          beat(2.42, 2); packet(2.5, 'chaff', .23, 5, .038, .05, 1.06); packet(2.72, 'chaff', .77, 5, .038, .05, 1.06);
        }
        break;
      case 'cross_rush':
        beat(.02, 0); enemy(.14, 'charger', .27, 1, { aim: 1.02, depth: .08 }); packet(.32, 'chaff', .73, 4, .055, .08, .96, { depth: .12 });
        beat(1.18, 1); enemy(1.2, 'charger', .73, 1.04, { aim: .96, depth: .03 }); packet(1.34, 'fast', .28, 3, .05, .16, 1);
        beat(2.45, 2); enemy(2.48, 'charger', .31, 1.08, { aim: .86 }); enemy(2.76, 'charger', .69, 1.08, { aim: .86 }); row(2.82, 'fast', 4, .22, .78, .15, 1.02);
        break;
      case 'iron_escort':
        beat(.02, 0); enemy(.12, 'armor', .5, 1, { depth: .04 }); row(.18, 'chaff', 5, .25, .75, .06, .98, { depth: .18 });
        beat(1.42, 1); enemy(1.46, 'armor', .3, 1.03); enemy(1.46, 'armor', .7, 1.03); packet(1.58, 'chaff', .5, 5, .045, .06, 1.02, { depth: .10 });
        beat(2.92, 2); enemy(2.96, 'armor', .5, 1.16); enemy(3.05, 'fast', .18, 1.02); enemy(3.05, 'fast', .82, 1.02); row(3.3, 'chaff', 6, .17, .83, .06, 1.05);
        break;

      case 'riven_tide':
