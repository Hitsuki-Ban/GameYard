<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">NEON OVERDRIVE</title>
  <desc id="description">A cyan and magenta bullet-hell flight cuts through a black neon city toward a red zero sun.</desc>
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05030f"/>
      <stop offset="0.58" stop-color="#100529"/>
      <stop offset="1" stop-color="#02030b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.24" stop-color="#ffd166"/>
      <stop offset="0.62" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#00f7ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 11.5H12" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#void)"/>
  <rect width="1600" height="900" fill="url(#scan)"/>
  <path d="M0 690 430 492 750 520 1600 228V900H0Z" fill="#08071b"/>
