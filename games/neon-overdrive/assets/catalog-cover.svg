    <text x="0" y="253" fill="#ff2bd6" font-family="Arial Black, Arial, sans-serif" font-size="98" font-weight="900" letter-spacing="-5">OVERDRIVE</text>
    <path d="M0 292H710" stroke="#00f7ff" stroke-width="3"/>
    <text x="0" y="345" fill="#ffd166" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="7">BULLET / SIGNAL / BREAK</text>
    <text x="0" y="404" fill="#b9b4d7" font-family="Arial, sans-serif" font-size="22" letter-spacing="2">THREAD THE BARRAGE.</text>
