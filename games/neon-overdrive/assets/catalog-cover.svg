    <path d="M0 840 750 520 1600 414"/>
    <path d="M180 900 750 520 1530 900"/>
    <path d="M420 900 750 520 1280 900"/>
    <path d="M650 900 750 520 1030 900"/>
  </g>
  <g transform="translate(950 42)">
