<!doctype html>
<html lang="und" data-i18n-ready="false" data-motion="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05040d" />
    <meta name="description" content="" />
    <title>NEON OVERDRIVE</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305040d'/%3E%3Cpath d='M32 7 52 51 32 42 12 51Z' fill='%2300f7ff'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%23ff2bd6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="ambient ambient-a" aria-hidden="true"></div>
      <div class="ambient ambient-b" aria-hidden="true"></div>

      <main id="cabinet" class="cabinet">
        <aside class="flight-rail status-rail" aria-hidden="true">
          <div class="brand-mark">N/O</div>
          <div class="rail-rule"></div>
          <div class="rail-meter">
            <span data-i18n="hud.drive"></span>
            <strong id="side-sync">000</strong>
          </div>
          <div class="rail-meter">
            <span data-i18n="hud.threat"></span>
            <strong id="side-threat"></strong>
          </div>
          <div class="rail-rule"></div>
          <div class="rail-meter rail-meter-large">
            <span data-i18n="hud.chain"></span>
            <strong id="side-chain">0.00</strong>
          </div>
        </aside>

        <section id="screen-shell" class="screen-shell">
          <canvas
            id="gameCanvas"
            width="540"
            height="960"
            tabindex="0"
            aria-describedby="canvas-instructions"
          ></canvas>
          <div class="crt-overlay" aria-hidden="true"></div>
          <div id="danger-vignette" class="danger-vignette" aria-hidden="true"></div>

          <header id="hud" class="hud hud-hidden">
            <div class="hud-top">
              <div class="hud-score">
                <span class="hud-label" data-i18n="hud.score"></span>
                <strong id="score-value">000000000</strong>
              </div>
              <div id="hype-grade" class="hype-grade grade-c">C</div>
              <div class="hud-stage">
                <span class="hud-label" id="mode-label"></span>
                <strong id="stage-label"></strong>
              </div>
            </div>

            <div id="boss-hud" class="boss-hud boss-hud-hidden">
              <div class="boss-meta">
                <span id="boss-name"></span>
                <span id="boss-phase"></span>
              </div>
              <div class="boss-bar"><i id="boss-bar-fill"></i></div>
            </div>

            <div class="hud-bottom">
              <div id="shield-wrap" class="shield-wrap">
                <span class="hud-label" data-i18n="hud.shield"></span>
                <div id="shield-pips" class="shield-pips"></div>
              </div>
              <div id="drive-wrap" class="drive-wrap">
                <div class="drive-meta">
                  <span class="hud-label" data-i18n="hud.drive"></span>
                  <strong id="drive-value">0%</strong>
                </div>
                <div id="drive-bar" class="drive-bar"><i id="drive-bar-fill"></i></div>
              </div>
              <div class="chain-wrap">
                <span class="hud-label" data-i18n="hud.chain"></span>
                <strong id="chain-value">0.00</strong>
              </div>
            </div>
          </header>

          <button id="touch-drive" class="touch-drive" type="button" hidden>
            <span>DROP</span><small aria-hidden="true">●</small>
          </button>

          <section id="title-screen" class="title-screen">
            <div class="title-grid" aria-hidden="true"></div>
            <div class="title-content">
              <div class="eyebrow" data-i18n="title.eyebrow"></div>
              <h1><span>NEON</span><span>OVERDRIVE</span></h1>
              <div class="title-subtitle" data-i18n="title.subtitle"></div>
              <button id="ignite-button" class="ignite-button" type="button">
                <span class="ignite-core" data-i18n="title.ignite"></span>
                <span class="ignite-sub" data-i18n="title.igniteHint"></span>
              </button>
              <nav class="title-actions">
                <button
                  id="mode-button"
                  class="text-button"
                  type="button"
                  data-i18n="menu.mode"
                ></button>
                <button
                  id="settings-button"
                  class="text-button"
                  type="button"
                  data-i18n="menu.settings"
                ></button>
                <button
                  id="archive-button"
                  class="text-button"
                  type="button"
                  data-i18n="menu.archive"
                ></button>
              </nav>
              <div id="best-score-title" class="best-score-title"></div>
            </div>
            <p class="photosensitive-note" data-i18n="title.photosensitiveWarning"></p>
          </section>
        </section>

        <aside class="flight-rail interaction-rail localized-ui">
          <div class="interaction-heading">
            <span class="rail-kicker" data-i18n="control.kicker"></span>
            <strong data-i18n="control.title"></strong>
          </div>
          <div id="canvas-instructions" class="control-legend">
            <span id="control-move"></span>
            <span id="control-focus"></span>
            <span id="control-drop"></span>
            <span id="control-pause"></span>
          </div>
          <div class="rail-spectrum" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </aside>
      </main>

      <dialog id="mode-dialog" class="panel-dialog" aria-labelledby="mode-dialog-title">
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" data-i18n="mode.eyebrow"></div>
              <h2 id="mode-dialog-title" data-i18n="mode.title"></h2>
            </div>
            <button id="mode-close" class="icon-button" type="button">
              <span aria-hidden="true">×</span>
            </button>
          </header>
          <div class="dialog-scroll">
            <div class="mode-grid">
              <button class="mode-card" data-mode="story" type="button">
                <span class="mode-index">01</span><strong data-i18n="mode.story.name"></strong
                ><small data-i18n="mode.story.description"></small>
              </button>
              <button class="mode-card" data-mode="rush" type="button">
                <span class="mode-index">02</span><strong data-i18n="mode.rush.name"></strong
                ><small data-i18n="mode.rush.description"></small>
              </button>
              <button class="mode-card" data-mode="endless" id="endless-mode-card" type="button">
                <span class="mode-index">03</span><strong data-i18n="mode.endless.name"></strong
                ><small id="endless-mode-note"></small>
              </button>
            </div>
          </div>
          <footer class="dialog-actions">
            <button
              class="primary-button"
              id="mode-confirm"
              type="button"
              data-i18n="menu.confirm"
            ></button>
          </footer>
        </div>
      </dialog>

      <dialog id="archive-dialog" class="panel-dialog" aria-labelledby="archive-dialog-title">
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" data-i18n="archive.eyebrow"></div>
              <h2 id="archive-dialog-title" data-i18n="archive.title"></h2>
            </div>
            <button id="archive-close" class="icon-button" type="button">
              <span aria-hidden="true">×</span>
            </button>
          </header>
          <div class="dialog-scroll archive-body">
            <p data-i18n="archive.intro"></p>
            <div class="archive-columns">
              <div>
                <strong data-i18n="archive.accessible.name"></strong
                ><span data-i18n="archive.accessible.description"></span>
              </div>
              <div>
                <strong data-i18n="archive.mastery.name"></strong
                ><span data-i18n="archive.mastery.description"></span>
              </div>
              <div>
                <strong data-i18n="archive.browser.name"></strong
                ><span data-i18n="archive.browser.description"></span>
              </div>
            </div>
            <p class="archive-small" data-i18n="archive.runtimeNote"></p>
          </div>
          <footer class="dialog-actions">
            <button
              id="archive-back"
              class="primary-button"
              type="button"
              data-i18n="menu.back"
            ></button>
          </footer>
        </div>
      </dialog>

      <dialog
        id="settings-dialog"
        class="panel-dialog settings-dialog"
        aria-labelledby="settings-dialog-title"
      >
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" data-i18n="settings.eyebrow"></div>
              <h2 id="settings-dialog-title" data-i18n="settings.title"></h2>
            </div>
            <button id="settings-close" class="icon-button" type="button">
              <span aria-hidden="true">×</span>
            </button>
          </header>
          <div class="dialog-scroll settings-sections">
            <section class="settings-group" aria-labelledby="host-settings-title">
              <div class="settings-group-heading">
                <h3 id="host-settings-title" data-i18n="settings.host.title"></h3>
                <span id="host-revision"></span>
              </div>
              <div class="settings-list">
                <label
                  ><span data-i18n="settings.host.master"></span
                  ><input id="master-volume" type="range" min="0" max="1" step="0.01" /><output
                    id="master-volume-output"
                  ></output
                ></label>
                <label
                  ><span data-i18n="settings.host.music"></span
                  ><input id="music-volume" type="range" min="0" max="1" step="0.01" /><output
                    id="music-volume-output"
                  ></output
                ></label>
                <label
                  ><span data-i18n="settings.host.sfx"></span
                  ><input id="sfx-volume" type="range" min="0" max="1" step="0.01" /><output
                    id="sfx-volume-output"
                  ></output
                ></label>
                <label class="toggle-row"
                  ><span data-i18n="settings.host.reducedMotion"></span
                  ><input id="reduced-motion" type="checkbox" /><i aria-hidden="true"></i
                ></label>
                <label class="toggle-row"
                  ><span data-i18n="settings.host.screenShake"></span
                  ><input id="screen-shake" type="checkbox" /><i aria-hidden="true"></i
                ></label>
              </div>
              <p id="host-settings-status" class="settings-status"></p>
            </section>
            <section class="settings-group" aria-labelledby="game-settings-title">
              <h3 id="game-settings-title" data-i18n="settings.game.title"></h3>
              <div class="settings-list">
                <label
                  ><span data-i18n="settings.game.fxDensity"></span
                  ><select id="fx-density">
                    <option value="1" data-i18n="settings.fx.max"></option>
                    <option value="0.68" data-i18n="settings.fx.balanced"></option>
                    <option value="0.38" data-i18n="settings.fx.low"></option></select
                ></label>
                <label class="toggle-row"
                  ><span data-i18n="settings.game.showHitbox"></span
                  ><input id="show-hitbox" type="checkbox" /><i aria-hidden="true"></i
                ></label>
                <label class="toggle-row"
                  ><span data-i18n="settings.game.autoGuard"></span
                  ><input id="auto-guard" type="checkbox" /><i aria-hidden="true"></i
                ></label>
              </div>
            </section>
          </div>
          <footer class="dialog-actions">
            <button
              id="settings-save"
              class="primary-button"
              type="button"
              data-i18n="settings.save"
            ></button>
            <button
              id="fullscreen-button"
              class="secondary-button"
              type="button"
              data-i18n="settings.fullscreen"
            ></button>
          </footer>
        </div>
      </dialog>

      <dialog
        id="pause-dialog"
        class="panel-dialog compact-dialog"
        aria-labelledby="pause-dialog-title"
      >
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" data-i18n="pause.eyebrow"></div>
              <h2 id="pause-dialog-title" data-i18n="pause.title"></h2>
            </div>
          </header>
          <div class="dialog-actions vertical-actions">
            <button
              id="resume-button"
              class="primary-button"
              type="button"
              data-i18n="pause.resume"
            ></button>
            <button
              id="restart-button"
              class="secondary-button"
              type="button"
              data-i18n="pause.restart"
            ></button>
            <button
              id="quit-button"
              class="secondary-button"
              type="button"
              data-i18n="pause.toTitle"
            ></button>
          </div>
        </div>
      </dialog>

      <dialog
        id="upgrade-dialog"
        class="panel-dialog upgrade-dialog"
        aria-labelledby="upgrade-dialog-title"
      >
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" data-i18n="upgrade.eyebrow"></div>
              <h2 id="upgrade-dialog-title" data-i18n="upgrade.title"></h2>
              <p data-i18n="upgrade.description"></p>
            </div>
          </header>
          <div id="upgrade-cards" class="dialog-scroll upgrade-cards"></div>
          <footer class="dialog-actions upgrade-hint" data-i18n="upgrade.hint"></footer>
        </div>
      </dialog>

      <dialog id="result-dialog" class="panel-dialog result-dialog" aria-labelledby="result-title">
        <div class="dialog-surface">
          <header class="dialog-header">
            <div>
              <div class="panel-eyebrow" id="result-eyebrow"></div>
              <h2 id="result-title"></h2>
            </div>
          </header>
          <div class="dialog-scroll result-body">
            <div>
              <span class="hud-label" data-i18n="result.score"></span>
              <div class="result-score" id="result-score">000000000</div>
            </div>
            <div class="result-grid">
              <div>
                <span data-i18n="result.maxChain"></span><strong id="result-chain">0.00</strong>
              </div>
              <div><span data-i18n="result.graze"></span><strong id="result-graze">0</strong></div>
              <div><span data-i18n="result.kills"></span><strong id="result-kills">0</strong></div>
              <div><span data-i18n="result.grade"></span><strong id="result-grade">C</strong></div>
            </div>
            <div id="new-record" class="new-record" data-i18n="result.newRecord"></div>
          </div>
          <footer class="dialog-actions">
            <button
              id="result-retry"
              class="primary-button"
              type="button"
              data-i18n="result.retry"
            ></button>
            <button
              id="result-title-button"
              class="secondary-button"
              type="button"
              data-i18n="result.toTitle"
            ></button>
          </footer>
        </div>
      </dialog>

      <div id="toast" class="toast"></div>
      <div
        id="status-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
