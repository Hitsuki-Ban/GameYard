name: Verify and publish

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gameyard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24.18.1
  RELEASE_ARTIFACT: gameyard-site-${{ github.sha }}
  RELEASE_METADATA: .gameyard/release-metadata.json
  ARTIFACT_REPORT: .gameyard/artifact-report.json

jobs:
  registry:
    name: Resolve production registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game-matrix: ${{ steps.registry.outputs.game-matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Export registered game matrix
        id: registry
        run: vp exec node tooling/production-registry-ci.mjs --github-output "$GITHUB_OUTPUT"

  quality:
    name: Shared quality gates
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run tooling:test
      - name: Preserve shared package behavior baselines
        run: >-
          vp run --filter "./apps/**" --filter "./packages/**"
          --fail-if-no-match --concurrency-limit 1 test

  game-baseline:
    name: Game baseline · ${{ matrix.gameId }}
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry.outputs.game-matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: vp install --frozen-lockfile
      - name: Install package-pinned browser
        run: vp run "${{ matrix.packageName }}#browser:install"
      - name: Install ImageMagick 7
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          brew install imagemagick-full
          imagemagick_bin="$(brew --prefix imagemagick-full)/bin"
          echo "$imagemagick_bin" >> "$GITHUB_PATH"
          "$imagemagick_bin/magick" -version | tee /dev/stderr | grep -qw rsvg
      - name: Preserve registered game behavior baseline
        run: vp run "${{ matrix.packageName }}#test"

  artifact:
    name: Build the immutable artifact
    needs: [quality, game-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run build
      - name: Download the prior successful main artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow verify-and-publish.yml --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')"
          read -r previous_run_id previous_source_sha <<< "$previous_run"
          test "$previous_run_id" != "null"
          test "$previous_source_sha" != "null"
          mkdir -p .gameyard/previous
          gh run download "$previous_run_id" --name "gameyard-site-$previous_source_sha" --dir .gameyard/previous
      - name: Report static asset budget and source-artifact delta
        run: >-
          vp exec node tooling/artifact-report.mjs write
          --directory dist
          --previous-directory .gameyard/previous/dist
          --policy deployment/static-asset-policy.json
          --output "${{ env.ARTIFACT_REPORT }}"
          --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Record release identity
        run: >-
          vp exec node tooling/release-metadata.mjs write
          --source-sha "${{ github.sha }}"
          --file "${{ env.RELEASE_METADATA }}"
      - name: Verify release identity
        run: >-
          vp exec node tooling/release-metadata.mjs verify
          --source-sha "${{ github.sha }}"
          --file "${{ env.RELEASE_METADATA }}"
      - name: Upload the verified artifact once
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            dist
            deployment
            provenance
            wrangler.jsonc
            ${{ env.ARTIFACT_REPORT }}
            ${{ env.RELEASE_METADATA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish artifact evidence
        run: |
          echo "### GameYard release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.upload.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  host-smoke:
    name: Root and repository-prefix launch smoke
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Verify the downloaded artifact
        run: |
          vp run artifact:verify
          vp exec node tooling/release-metadata.mjs verify --source-sha "${{ github.sha }}" --file "${{ env.RELEASE_METADATA }}"
      - run: vp exec playwright install chromium
      - name: Root launch and PWA lifecycle
        run: >-
          vp exec playwright test
          tests/e2e/guest-conformance.spec.ts tests/e2e/pwa.spec.ts
          --config playwright.config.ts --project desktop-chromium
      - name: Repository-prefix launch and PWA lifecycle
        run: >-
          vp exec playwright test
          tests/release/catalog-prefix.spec.ts tests/release/pwa-prefix.spec.ts
          --config playwright.release.config.ts

  cloudflare-dry-run:
    name: Cloudflare dry-run from artifact
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Verify the downloaded artifact
        run: |
          vp run artifact:verify
          vp exec node tooling/release-metadata.mjs verify --source-sha "${{ github.sha }}" --file "${{ env.RELEASE_METADATA }}"
      - run: vp exec wrangler deploy --env preview --dry-run

  public-release:
    name: Public release journey from artifact
    needs: artifact
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Verify the downloaded artifact
        run: |
          vp run artifact:verify
          vp exec node tooling/release-metadata.mjs verify --source-sha "${{ github.sha }}" --file "${{ env.RELEASE_METADATA }}"
      - run: vp exec playwright install chromium
      - name: Run the complete public release journey without rebuilding
        run: >-
          vp exec playwright test
          tests/release/pulse-release.spec.ts tests/release/public-accessibility.spec.ts
          --config playwright.release.config.ts

  cloudflare-production:
    name: Cloudflare production from artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [artifact, host-smoke, cloudflare-dry-run, public-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    outputs:
      version-id: ${{ steps.deployment-evidence.outputs.version-id }}
      target: ${{ steps.deployment-evidence.outputs.target }}
      build-id: ${{ steps.deployment-evidence.outputs.build-id }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify the downloaded artifact
        run: |
          vp run artifact:verify
          vp exec node tooling/release-metadata.mjs verify --source-sha "${{ github.sha }}" --file "${{ env.RELEASE_METADATA }}"
      - name: Install the live-smoke browser
        run: vp exec playwright install chromium
      - name: Deploy without rebuilding
        env:
          WRANGLER_OUTPUT_FILE_PATH: .gameyard/wrangler-production.ndjson
        run: vp exec wrangler deploy --env production --strict --message "GameYard ${{ github.sha }} artifact sha256:${{ needs.artifact.outputs.artifact-digest }}"
      - name: Verify machine-readable deployment evidence
        id: deployment-evidence
        run: >-
          vp exec node deployment/parse-cloudflare-deploy.mjs
          --file .gameyard/wrangler-production.ndjson
          --metadata "${{ env.RELEASE_METADATA }}"
          --artifact-digest "sha256:${{ needs.artifact.outputs.artifact-digest }}"
          --github-output "$GITHUB_OUTPUT"
          --evidence .gameyard/cloudflare-production.json
      - name: Smoke the deployed root and repository prefix
        run: vp exec node deployment/live-smoke.mjs --evidence .gameyard/cloudflare-production.json
      - name: Publish production evidence
        run: |
          game_count="$(jq '.manifests | length' "${{ env.RELEASE_METADATA }}")"
          launch_count="$((game_count * 2))"
          echo "### Cloudflare production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: \`${{ steps.deployment-evidence.outputs.build-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.deployment-evidence.outputs.version-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ steps.deployment-evidence.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root and \`/GameYard/\`: ${launch_count} launches from ${game_count} catalog games passed without page, console, request, or HTTP failures." >> "$GITHUB_STEP_SUMMARY"
