<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PULSE LINK — Logic Smoke Test</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme:dark; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:#060716; color:#edfaff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:28px; background:radial-gradient(circle at 50% 0,#15164a 0,#060716 58%); }
    main { width:min(880px,100%); margin:auto; border:1px solid #2a7e9e; border-radius:18px; padding:24px; background:rgba(7,10,31,.86); box-shadow:0 22px 80px #0008; }
    h1 { margin:0; font:900 clamp(24px,5vw,44px)/1 system-ui,sans-serif; font-style:italic; letter-spacing:-.04em; }
    .meta { color:#9eb4ca; margin:8px 0 20px; }
    #summary { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid #31465c; border-radius:12px; }
    #lamp { width:14px; height:14px; border-radius:50%; background:#ffc94a; box-shadow:0 0 15px currentColor; }
    #summary.pass #lamp { background:#a8ff45; }
    #summary.fail #lamp { background:#ff486f; }
    #status { font-weight:900; letter-spacing:.08em; }
    ol { margin:20px 0 0; padding-left:28px; columns:2; column-gap:38px; }
    li { break-inside:avoid; padding:5px 0; color:#dce8f6; }
    li::marker { color:#19d7ff; font-weight:900; }
    pre { white-space:pre-wrap; color:#ff9ab1; border-left:3px solid #ff486f; padding:12px; background:#240b18; border-radius:6px; }
    @media (max-width:680px) { body{padding:12px} main{padding:18px} ol{columns:1} }
  </style>
</head>
<body>
<main>
  <h1>PULSE LINK // LOGIC SMOKE</h1>
  <p class="meta">确定性核心回归 · 无构建工具 · 直接在浏览器执行</p>
  <div id="summary"><i id="lamp"></i><span id="status">RUNNING…</span></div>
  <ol id="results"></ol>
  <pre id="error" hidden></pre>
</main>
<script src="../src/config.js"></script>
<script src="../src/i18n.js"></script>
<script src="../src/model.js"></script>
<script>
(() => {
  'use strict';
  const list = document.getElementById('results');
  const summary = document.getElementById('summary');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');
  const passed = [];
  const assert = (condition, name, detail = '') => {
    if (!condition) throw new Error(`${name}${detail ? ` :: ${detail}` : ''}`);
    passed.push(name);
    const item = document.createElement('li');
    item.textContent = name;
    list.appendChild(item);
  };
  const cell = (kind, color) => PLO.makeCell(kind, color, { id: Math.floor(Math.random() * 1e6) });
  const tickBoard = (board, frames = 60) => { for (let i = 0; i < frames; i++) board.update(1 / 60, false); };
  const makeGame = (mode = 'lab', seed = 1) => {
    const game = new PLO.GameSession({ mode, difficulty:1, seed, bus:new PLO.EventBus(), settings:{ reducedMotion:true } });
    game.state = 'playing'; game.countdown = 0;
    return game;
  };

  try {
    {
      assert(PLO.I18n.catalogKeys.length>=100,'三语目录包含完整界面键',`keys=${PLO.I18n.catalogKeys.length}`);
      assert(PLO.I18n.resolveSystemLocale(['zh-Hant-TW'])==='zh-CN','中文系统语言映射到中文目录');
      assert(PLO.I18n.resolveSystemLocale(['fr-FR','ja-JP'])==='ja','系统语言列表选择首个受支持语言');
      assert(PLO.I18n.resolveSystemLocale(['en-GB'])==='en','英语系统语言映射到英文目录');
      assert(PLO.I18n.resolveSystemLocale(['fr-FR'])==='en','不受支持的系统语言采用明确英文策略');
      const i18n=new PLO.I18n({mode:'auto',languages:['ja-JP']});
      i18n.setMode('zh-CN');
      assert(i18n.locale==='zh-CN'&&i18n.t('mode.duel')==='对战','手动语言模式覆盖系统语言');
      i18n.refreshSystemLocale(['en-US']);
      assert(i18n.locale==='zh-CN','手动语言模式不响应系统语言变化');
      let missingKey=false,missingParam=false;
      try{i18n.t('missing.key');}catch(error){missingKey=error instanceof ReferenceError;}
      try{i18n.t('aria.attack');}catch(error){missingParam=error instanceof ReferenceError;}
      assert(missingKey&&missingParam,'缺少翻译键或插值参数时立即报错');
      i18n.destroy();
      const controlDescriptions=PLO.I18n.supportedLocales.map(locale=>{
        const catalog=new PLO.I18n({mode:locale});
        const description=catalog.t('aria.gameControls');
        catalog.destroy();
        return description;
      });
      assert(controlDescriptions.every(text=>['X','K','Z','J','P'].every(key=>text.includes(key))&&text.includes('Escape')),'三语辅助操作说明覆盖双向旋转与暂停');
    }
    {
      const key='pulse-link-overdrive.smoke.save';
      const originalWarn=console.warn;
      console.warn=()=>{};
      try {
        localStorage.setItem(key,'{"settings":{"localeMode":"fr"}}');
        const invalidModeStore=new PLO.SaveStore(key);
        assert(invalidModeStore.recovery==='repaired'&&PLO.validateSaveData(invalidModeStore.data),'非法语言存档会被明确修复');
        assert(PLO.I18n.readStoredMode(localStorage,key)==='auto','修复后的存档以自动语言启动');
        localStorage.setItem(key,'{broken json');
        const malformedStore=new PLO.SaveStore(key);
        assert(malformedStore.recovery==='repaired'&&PLO.validateSaveData(JSON.parse(localStorage.getItem(key))),'损坏 JSON 存档可恢复并重新持久化');
        let statusNotified=false;
        const failingStorage={getItem:()=>null,setItem:()=>{throw new DOMException('quota','QuotaExceededError');}};
        const failingStore=new PLO.SaveStore(`${key}.failure`,failingStorage);
        failingStore.subscribeStatus(()=>{statusNotified=true;});
        failingStore.patchSettings({localeMode:'ja'});
        assert(!failingStore.available&&failingStore.recovery==='unavailable'&&statusNotified,'运行期间存档写入失败会发出可见状态');
      } finally {
        console.warn=originalWarn;
        localStorage.removeItem(key);
      }
    }
    {
      const game=makeGame('lab',11), player=game.player, board=player.board;
      board.spawnDisabled=true; board.active=null; board.grid=PLO.logic.createEmptyGrid();
      const R=PLO.CONFIG.ROWS;
      board.grid[R-1][0]=cell('normal',1); board.grid[R-1][1]=cell('normal',1);
      board.grid[R-1][2]=cell('normal',0); board.grid[R-2][2]=cell('normal',0); board.grid[R-3][2]=cell('normal',0); board.grid[R-4][2]=cell('normal',1);
      board.grid[R-1][3]=cell('pulse',-1); board.startResolution(false); tickBoard(board,120);
      assert(player.cp===122,'两段连锁与脉冲 CP 正确',`cp=${player.cp}`);
      assert(player.maxChain===2,'连锁段数递增',`chain=${player.maxChain}`);
      assert(board.grid.flat().filter(Boolean).length===0,'连锁后盘面正确清空');
    }
    {
      const game=makeGame('lab',12), player=game.player, board=player.board;
      board.spawnDisabled=true; board.active=null; board.grid=PLO.logic.createEmptyGrid(); const R=PLO.CONFIG.ROWS;
      for(let x=0;x<3;x++) board.grid[R-1][x]=cell('normal',2);
      board.grid[R-1][6]=cell('pulse',-1); board.startResolution(false); tickBoard(board,70);
      assert(player.cp===6,'非邻接脉冲不提供 CP',`cp=${player.cp}`);
      assert(board.grid[R-1][6]?.kind==='pulse','非邻接脉冲保留');
    }
    {
      const grid=PLO.logic.createEmptyGrid(), R=PLO.CONFIG.ROWS;
      grid[R-1][0]=cell('normal',0); grid[R-2][1]=cell('normal',0); grid[R-3][2]=cell('normal',0);
      assert(PLO.logic.findClearData(grid)===null,'对角相邻不会清除');
      grid[R-2][0]=cell('normal',0); grid[R-3][0]=cell('normal',0);
      assert(PLO.logic.findClearData(grid).regular>=3,'四方向三连通会清除');
    }
    {
      const game=makeGame('lab',13), board=game.player.board;
      board.grid=PLO.logic.createEmptyGrid(); board.grid[0][0]=cell('normal',0); board.grid[1][6]=cell('normal',1);
      assert(!board.checkCenterTop(),'侧列进入隐藏区仍安全');
      board.grid[1][PLO.CONFIG.CENTER_COL]=cell('normal',2);
      assert(board.checkCenterTop(),'中央列进入隐藏区判负');
    }
    {
      const game=makeGame('duel',14); game.projectiles=[]; game.player.cp=350; game.player.lastChain=0; game.player.recentChainTimer=0;
      assert(game.player.castAttack(),'100+ CP 可发动攻击');
      assert(game.player.cp===0,'攻击消耗全部 CP');
      assert(game.projectiles.at(-1).lines===3,'350 CP 产生 3 行压力',`lines=${game.projectiles.at(-1).lines}`);
    }
    {
      const game=makeGame('duel',15); game.projectiles=[];
      const projectile=game.launchAttack(game.cpu,game.player,4,500,0); game.player.cp=270;
      assert(game.player.castDefense(),'100+ CP 可发动防御');
      assert(game.player.cp===0,'防御消耗全部 CP');
      assert(projectile.lines===1,'270 CP 抵消 3 行在途攻击',`remaining=${projectile.lines}`);
    }
    {
      const game=makeGame('duel',16), board=game.player.board;
      const before=board.grid.flat().filter(Boolean).length; board.receiveLines(3);
      assert(board.pendingLines===3,'活动块存在时攻击进入待处理队列');
      assert(board.grid.flat().filter(Boolean).length===before,'待处理攻击不会提前改写盘面');
    }
    {
      const game=makeGame('lab',17), board=game.player.board; let valid=true, bad='';
      for(let n=0;n<500;n++){
        const row=board.makeRiseRow();
        for(let x=2;x<row.length;x++) if(row[x].color===row[x-1].color&&row[x].color===row[x-2].color){ valid=false; bad=`row ${n}`; break; }
      }
      assert(valid,'500 组上升行无横向天然三连',bad);
    }
    {
      const game=makeGame('duel',18), player=game.player; const start=player.board.active.x; const consumed=new Set();
      const mock={ isDown:()=>false, consume:action=>{ if(action==='left'&&!consumed.has(action)){consumed.add(action);return true;} return false; } };
      player.updateHuman(1/60,mock);
      assert(player.board.active.x===start-1,'单帧移动输入不会丢失');
    }
    {
      const game=makeGame('lab',19); game.cpu.board.lose('test');
      assert(!game.cpu.board.dead,'LAB 目标触顶后解除死亡态');
      assert(game.cpu.board.grid.flat().filter(Boolean).length>0,'LAB 目标触顶后重新填充');
    }
    {
      const game=makeGame('blitz',20); game.timeLeft=.01;
      game.update(.02,{isDown:()=>false,consume:()=>false});
      assert(game.ended,'BLITZ 在计时归零后结算');
    }
    let locks=0;
    for(let seed=30;seed<35;seed++){
      const bus=new PLO.EventBus(); bus.on('pieceLock',()=>locks++);
      const game=new PLO.GameSession({mode:'duel',difficulty:seed%4,seed,bus,settings:{reducedMotion:true}}); game.state='playing';
      const rng=new PLO.RNG(seed*91);
      for(let frame=0;frame<18000&&!game.ended;frame++){
        const board=game.player.board;
        if(board.active&&!board.resolution&&frame%22===0){
          const turns=rng.int(0,3); for(let i=0;i<turns;i++) board.rotate(1);
          const target=rng.int(0,6); for(let i=0;i<8&&board.active&&board.active.x!==target;i++) board.move(Math.sign(target-board.active.x),0);
          board.hardDrop(false);
        }
        if(game.player.cp>=100&&frame%180===0) (rng.chance(.65)?game.player.castAttack():game.player.castDefense());
        game.update(1/60,{isDown:()=>false,consume:()=>false});
      }
    }
    assert(locks>60,'多难度 AI/状态机浸泡完成',`locks=${locks}`);
    summary.classList.add('pass');
    status.textContent=`PASS · ${passed.length} ASSERTIONS · ${locks} LOCKS`;
  } catch (error) {
    summary.classList.add('fail');
    status.textContent=`FAIL · ${passed.length} PASSED`;
    errorBox.hidden=false;
    errorBox.textContent=error?.stack || String(error);
    console.error(error);
  }
})();
</script>
</body>
</html>
